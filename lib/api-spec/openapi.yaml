        intro:           { type: ["string", "null"] }
        notes:           { type: ["string", "null"] }
        createdByUserId: { type: integer }
        createdAt:       { type: string }
        updatedAt:       { type: string }

    SalesProposalDetail:
      allOf:
        - $ref: "#/components/schemas/SalesProposal"
