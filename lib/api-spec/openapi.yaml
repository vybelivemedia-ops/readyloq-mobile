        opportunityIds:
          type: array
          items: { type: integer }
        intro: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    SalesProposalUpdate:
      type: object
      properties:
        title: { type: string }
        intro: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [draft, sent, accepted, declined] }
        opportunityIds:
          type: array
          items: { type: integer }

    # ── ROLE BRIEFING SCHEMAS ────────────────────────────────────────────────────
    BriefingRecentInspection:
      type: object
      required: [id, siteAddress, status, findingsCount, createdAt]
      properties:
        id:            { type: integer }
        siteAddress:   { type: string }
        status:        { type: string }
        findingsCount: { type: integer }
        createdAt:     { type: string }

    BriefingSiteHistory:
      type: object
      required: [siteAddress, visitCount, lastInspectionId, lastFindingsCount, pestTypes]
      properties:
        siteAddress:        { type: string }
        visitCount:         { type: integer }
        lastVisitedAt:      { type: string, nullable: true }
        lastInspectionId:   { type: integer }
        lastFindingsCount:  { type: integer }
        pestTypes:
          type: array
          items: { type: string }

    TechnicianBriefing:
      type: object
      required:
        [totalInspections, completedInspections, openInspections, completedThisWeek, recentInspections, siteHistory]
      properties:
        totalInspections:     { type: integer }
        completedInspections: { type: integer }
        openInspections:      { type: integer }
        completedThisWeek:    { type: integer }
        recentInspections:
          type: array
          items: { $ref: "#/components/schemas/BriefingRecentInspection" }
        siteHistory:
          type: array
          items: { $ref: "#/components/schemas/BriefingSiteHistory" }

    BriefingTopOpportunity:
      type: object
      required:
        [id, inspectionId, title, category, propertyAddress, priority, estimatedValueTier, status, createdAt]
      properties:
        id:                 { type: integer }
        inspectionId:       { type: integer }
        title:              { type: string }
        category:           { type: string }
        propertyAddress:    { type: string }
        priority:           { type: integer }
        estimatedValueTier: { type: string }
        riskLevel:          { type: ["string", "null"] }
        status:             { type: string }
        createdAt:          { type: string }

    SalesBriefing:
      type: object
      required: [pipeline, openCount, pipelineValue, staleCount, topOpportunities, proposals]
      properties:
        pipeline:
          type: object
          required: [new, reviewed, quoted, won, lost, dismissed]
          properties:
            new:       { type: integer }
            reviewed:  { type: integer }
            quoted:    { type: integer }
            won:       { type: integer }
            lost:      { type: integer }
            dismissed: { type: integer }
        openCount:     { type: integer }
        pipelineValue: { type: integer }
        staleCount:    { type: integer }
        topOpportunities:
          type: array
          items: { $ref: "#/components/schemas/BriefingTopOpportunity" }
        proposals:
          type: object
          required: [draft, sent, accepted, declined]
          properties:
            draft:    { type: integer }
            sent:     { type: integer }
            accepted: { type: integer }
            declined: { type: integer }

    BriefingApprovalItem:
      type: object
      required: [id, inspectionId, siteAddress, createdAt, ageDays]
      properties:
        id:           { type: integer }
        inspectionId: { type: integer }
        siteAddress:  { type: string }
        createdAt:    { type: string }
        ageDays:      { type: integer }

    BriefingTechnicianStat:
      type: object
      required: [technicianName, scorecards, avgQuality]
      properties:
        technicianName: { type: string }
        scorecards:     { type: integer }
        avgQuality:     { type: integer }

    BriefingCompletion:
      type: object
      required: [id, siteAddress, technicianName, findingsCount]
      properties:
        id:             { type: integer }
        siteAddress:    { type: string }
        technicianName: { type: string }
        completedAt:    { type: ["string", "null"] }
        findingsCount:  { type: integer }

    ManagerBriefing:
      type: object
      required: [pendingApprovals, approvalsQueue, team, recentCompletions]
      properties:
        pendingApprovals: { type: integer }
        approvalsQueue:
          type: array
          items: { $ref: "#/components/schemas/BriefingApprovalItem" }
        team:
          type: object
          required: [scorecardCount30d, highRisk30d, missedOpportunities30d, technicians]
          properties:
            scorecardCount30d:      { type: integer }
            avgQualityScore30d:     { type: ["integer", "null"] }
            highRisk30d:            { type: integer }
            missedOpportunities30d: { type: integer }
            technicians:
              type: array
              items: { $ref: "#/components/schemas/BriefingTechnicianStat" }
        recentCompletions:
          type: array
          items: { $ref: "#/components/schemas/BriefingCompletion" }

    BriefingAlert:
      type: object
      required: [type, severity, message, count]
      properties:
        type:
          type: string
          enum: [approvals_aging, quality_low, high_risk, stale_pipeline, share_links_expiring]
        severity:
          type: string
          enum: [info, warning, critical]
        message: { type: string }
        count:   { type: integer }

    OwnerBriefing:
      type: object
      required: [kpis, alerts]
      properties:
        kpis:
          type: object
          required:
            [completions7d, completions30d, openOpportunities, pipelineValue, approvedSummaries30d]
          properties:
            completions7d:        { type: integer }
            completions30d:       { type: integer }
            openOpportunities:    { type: integer }
            pipelineValue:        { type: integer }
            avgQualityScore30d:   { type: ["integer", "null"] }
            approvedSummaries30d: { type: integer }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/BriefingAlert" }

    RoleBriefing:
      type: object
      required: [role, generatedAt]
      properties:
        role:
          type: string
          enum: [technician, sales, manager, owner]
        generatedAt: { type: string }
        technician:  { $ref: "#/components/schemas/TechnicianBriefing" }
        sales:       { $ref: "#/components/schemas/SalesBriefing" }
        manager:     { $ref: "#/components/schemas/ManagerBriefing" }
        owner:       { $ref: "#/components/schemas/OwnerBriefing" }

    GeminiConversation:
      type: object
      required: [id, title, createdAt]
      properties:
        id:          { type: integer }
        title:       { type: string }
        createdAt:   { type: string, format: date-time }

    GeminiMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:             { type: integer }
        conversationId: { type: integer }
        role:           { type: string }
        content:        { type: string }
        createdAt:      { type: string, format: date-time }

    GeminiConversationInput:
      type: object
      required: [title]
      properties:
        title: { type: string }

    GeminiMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string }

    GeminiConversationWithMessages:
      type: object
      required: [id, title, createdAt, messages]
      properties:
        id:        { type: integer }
        title:     { type: string }
        createdAt: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: "#/components/schemas/GeminiMessage" }

    GeminiImageInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }

    GeminiImageOutput:
      type: object
      required: [b64_json, mimeType]
      properties:
        b64_json: { type: string }
        mimeType: { type: string }

    GeminiError:
      type: object
      required: [error]
      properties:
        error: { type: string }

    # ── TECHNICIAN / DAILY RIG SCHEMAS ───────────────────────────────────────────
    ProductLabelRules:
      type: object
      required:
        [
          id,
          productId,
          approvedPestTypes,
          approvedSiteClassifications,
          requiredEquipmentTypes,
          nozzleSpec,
          pressurePsi,
          dropletSize,
          maxRateOzPer1000Sqft,
          maxRateOzPerGallon,
          mixingSteps,
          maxTempF,
          phytotoxicityNotes,
          reEntryIntervalHours,
          retreatmentIntervalDays,
          createdAt,
        ]
      properties:
        id:        { type: integer }
        productId: { type: integer }
        approvedPestTypes:
          type: array
          items: { type: string }
        approvedSiteClassifications:
          type: array
          items: { type: string }
        requiredEquipmentTypes:
          type: array
          items: { type: string }
        nozzleSpec:    { type: ["string", "null"] }
        pressurePsi:   { type: ["string", "null"] }
        dropletSize:   { type: ["string", "null"] }
        maxRateOzPer1000Sqft: { type: ["number", "null"] }
        maxRateOzPerGallon:   { type: ["number", "null"] }
        mixingSteps:
          type: array
          items: { type: string }
        maxTempF: { type: ["integer", "null"] }
        phytotoxicityNotes: { type: ["string", "null"] }
        reEntryIntervalHours: { type: ["number", "null"] }
        retreatmentIntervalDays: { type: ["integer", "null"], description: "Minimum whole days before this product may legally be reapplied to the same site" }
        createdAt: { type: string }

    Product:
      type: object
      required: [id, name, epaRegistrationNumber, productType, activeIngredients, signalWord, manufacturerName, isActive, createdAt, labelRules]
      properties:
        id:                    { type: integer }
        name:                  { type: string }
        epaRegistrationNumber: { type: ["string", "null"] }
        productType:           { type: string, enum: [restricted-use, general-use] }
        activeIngredients:     { type: string }
        signalWord:            { type: ["string", "null"], enum: [DANGER, WARNING, CAUTION, NONE, null] }
        manufacturerName:      { type: ["string", "null"] }
        isActive:              { type: boolean }
        createdAt:             { type: string }
        labelRules:
          description: "Inlined product_label_rules row; null when none has been configured for this product"
          oneOf:
            - $ref: "#/components/schemas/ProductLabelRules"
            - type: "null"

    RouteAssignmentWithProduct:
      type: object
      required: [productId, targetPest, product]
      properties:
        productId:  { type: integer }
        targetPest: { type: string, description: "Canonical pest name, e.g. \"German Cockroaches\"" }
        notes:      { type: string, description: "Optional free-text context, e.g. \"perimeter only\"" }
        product:
          description: "null if the product has since been deleted from the catalogue"
          oneOf:
            - $ref: "#/components/schemas/Product"
            - type: "null"

    DailyRigLookupResult:
      type: object
      required: [setUp, technicianId, rigDate, assignments, createdAt, updatedAt]
      properties:
        setUp:        { type: boolean, enum: [true] }
        technicianId: { type: string }
        rigDate:      { type: string, description: "YYYY-MM-DD" }
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/RouteAssignmentWithProduct"
        createdAt: { type: string }
        updatedAt: { type: string }

    DailyRigNotSetUp:
      type: object
      required: [error, setUp]
      properties:
        error: { type: string }
        setUp: { type: boolean, enum: [false] }

    RouteAssignmentInput:
      type: object
      required: [productId, targetPest]
      properties:
        productId:  { type: integer }
        targetPest: { type: string, minLength: 1, description: "Canonical pest name, e.g. \"German Cockroaches\"" }
        notes:      { type: string, description: "Optional free-text context, e.g. \"perimeter only\"" }

    UpsertDailyRigInput:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/RouteAssignmentInput"
        date:
          type: string
          format: date
          description: Rig date (YYYY-MM-DD); defaults to today (server UTC) when omitted

    DailyRig:
      type: object
      required: [id, technicianId, rigDate, assignments, createdAt, updatedAt]
      properties:
        id:           { type: integer }
        technicianId: { type: string }
        rigDate:      { type: string, description: "YYYY-MM-DD" }
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/RouteAssignmentWithProduct"
        createdAt: { type: string }
        updatedAt: { type: string }

    RecentMix:
      type: object
      required: [logId, productId, productName, productActiveIngredients, targetPest, siteClassification, appliedAt]
      properties:
        logId:                    { type: integer }
        productId:                { type: integer }
        productName:              { type: string }
        productActiveIngredients: { type: string }
        targetPest:               { type: string }
        siteClassification:       { type: string }
        areaSqft:                 { type: ["number", "null"] }
        linearFt:                 { type: ["number", "null"] }
        totalProductOz:           { type: ["number", "null"] }
        equipmentUsed:            { type: ["string", "null"] }
        appliedAt:                { type: string }

    RouteReadinessProductStatus:
      type: string
      enum: [ready, short, insufficient-data]

    RouteReadinessOverallStatus:
      type: string
      enum: [ready, short, not-set-up]

    RouteReadinessProduct:
      type: object
      required: [productId, productName, targetPest, unit, quantityOnHand, avgUsagePerStop, expectedUsageToday, status]
      properties:
        productId:          { type: integer }
        productName:        { type: string }
        targetPest:         { type: string }
        unit:               { type: string }
        quantityOnHand:     { type: number }
        avgUsagePerStop:    { type: ["number", "null"], description: "Average quantity used per application over the last 30 days; null when there is no history yet" }
        expectedUsageToday: { type: ["number", "null"], description: "avgUsagePerStop * stopCount; null when avgUsagePerStop is null" }
        status:             { $ref: "#/components/schemas/RouteReadinessProductStatus" }

    RouteReadiness:
      type: object
      required: [technicianId, date, stopCount, rigSetUp, overallStatus, products]
      properties:
        technicianId:  { type: string }
        date:          { type: string, description: "YYYY-MM-DD" }
        stopCount:     { type: integer }
        rigSetUp:      { type: boolean }
        overallStatus: { $ref: "#/components/schemas/RouteReadinessOverallStatus" }
        products:
