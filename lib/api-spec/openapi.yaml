  # ── TECHNICIAN / DAILY RIG ───────────────────────────────────────────────────
  /technician/daily-rig:
    get:
      operationId: getDailyRig
      tags: [technician]
      summary: >-
        Fetch the authenticated technician's own route chemical assignments
        for a date (defaults to today, server UTC clock), each enriched with
        the full product record (including label rules).
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
          description: Rig date (YYYY-MM-DD); defaults to today (server UTC) when omitted
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRig"
        "401":
          description: Unauthorized
        "404":
          description: No route set up for this date
    post:
      operationId: upsertDailyRig
      tags: [technician]
      summary: >-
        Create or replace the authenticated technician's route chemical
        assignments for a date (defaults to today, server UTC clock).
        Upserts on (companyId, technicianId, rigDate), so retries are safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDailyRigInput"
      responses:
        "201":
          description: Created / replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRig"
        "400":
          description: Invalid body
        "401":
          description: Unauthorized

  /technician/daily-rig/recent-mixes:
    get:
      operationId: getRecentMixes
      tags: [technician]
      summary: >-
        Last-30-day treatment logs for the authenticated technician, deduped
        by (productId, siteClassification), newest first, capped at 5 — used
        for quick-pick suggestions in the treatment wizard.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentMix"
        "401":
          description: Unauthorized

  /technician/daily-rig/lookup:
    get:
      operationId: lookupDailyRig
      tags: [technician]
      summary: >-
        Read-only Route Readiness lookup for any technician/date pair. Used
        by the Integrated Route Calendar so a manager (or a technician
        looking at a future date) can see whether a stop's daily rig has been
        set up, without the editing affordances of GET/POST
        /technician/daily-rig (which always target the authenticated
        technician's own current-day rig). Self-lookups are always allowed;
        looking up another technician requires manager/owner/sales.
      parameters:
        - name: technicianId
          in: query
          required: true
          schema: { type: string }
          description: Clerk user ID of the technician whose daily rig to look up
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          description: Rig date (YYYY-MM-DD), matching the technician's device-local calendar date
      responses:
        "200":
          description: Rig found for this technician/date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRigLookupResult"
        "400":
          description: Missing or invalid technicianId/date params
        "403":
          description: Access denied — manager/owner/sales only when looking up another technician
        "404":
          description: No route set up for this technician/date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRigNotSetUp"

  /technician/daily-rig/route-readiness:
    get:
      operationId: getRouteReadiness
      tags: [technician]
      summary: >-
        Today's Route Readiness for one technician — compares their
        scheduled stops for a calendar date against their truck's on-hand
        quantities for the products declared on that date's rig, using
        recent per-application usage history to project what today is
        likely to consume. Proactive, TODAY-scoped signal; distinct from
        Truck Stock Health (a longer-range trending projection) and from the
        existing reactive restockThreshold alert. Self-lookups are always
        allowed; looking up another technician requires manager/owner/sales.
      parameters:
        - name: technicianId
          in: query
          schema: { type: string }
          description: Clerk user ID to look up; defaults to the authenticated caller
        - name: date
          in: query
          schema: { type: string, format: date }
          description: Rig date (YYYY-MM-DD); defaults to today (server UTC) when omitted
        - name: tzOffsetMinutes
          in: query
          schema: { type: integer }
          description: >-
            Caller's UTC offset in minutes (same convention as
            /schedule/route-calendar). Defaults to 0 (UTC) when omitted.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteReadiness"
        "401":
          description: Unauthorized
        "403":
          description: Access denied — manager/owner/sales only when looking up another technician

  /technician/daily-rig/team-route-readiness:
    get:
      operationId: getTeamRouteReadiness
      tags: [technician]
      summary: >-
        Today's Route Readiness computed for every technician in the
        company, for a calendar date. Manager/owner only.
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
          description: Rig date (YYYY-MM-DD); defaults to today (server UTC) when omitted
        - name: tzOffsetMinutes
          in: query
          schema: { type: integer }
          description: >-
            Caller's UTC offset in minutes (same convention as
            /schedule/route-calendar). Defaults to 0 (UTC) when omitted.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteReadiness"
        "403":
          description: Access denied — manager/owner only

