components:
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    SubmitFeedbackInput:
      type: object
      required: [type, title, description]
      properties:
        type:         { type: string, enum: [bug, feature, ai_accuracy] }
        title:        { type: string }
        description:  { type: string }
        severity:     { type: string, enum: [low, medium, high] }
        inspectionId: { type: integer }
        analysisId:   { type: integer }
        reportId:     { type: integer }

    UpdateFeedbackInput:
      type: object
      properties:
        status:   { type: string, enum: [open, triaged, resolved] }
        severity: { type: string, enum: [low, medium, high] }

    BetaFeedback:
      type: object
      required: [id, type, title, description, status, createdAt, updatedAt]
      properties:
        id:           { type: integer }
        type:         { type: string }
        title:        { type: string }
        description:  { type: string }
        severity:     { type: ["string", "null"] }
        status:       { type: string }
        userId:       { type: ["integer", "null"] }
        inspectionId: { type: ["integer", "null"] }
        analysisId:   { type: ["integer", "null"] }
        reportId:     { type: ["integer", "null"] }
        createdAt:    { type: string }
        updatedAt:    { type: string }

    ClientErrorInput:
      type: object
      required: [category, message]
      properties:
        category:     { type: string, enum: [upload, ai, report, auth] }
        message:      { type: string }
        context:      { type: object, additionalProperties: true }
        inspectionId: { type: integer }
        reportId:     { type: integer }

    ErrorEvent:
      type: object
      required: [id, category, message, source, createdAt]
      properties:
        id:           { type: integer }
        category:     { type: string }
        message:      { type: string }
        context:      { type: ["object", "null"], additionalProperties: true }
        userId:       { type: ["integer", "null"] }
        inspectionId: { type: ["integer", "null"] }
        reportId:     { type: ["integer", "null"] }
        source:       { type: string }
        createdAt:    { type: string }

    ErrorEventList:
      type: object
      required: [summary, events]
      properties:
        summary:
          type: object
          required: [upload, ai, report, auth, total]
          properties:
            upload: { type: integer }
            ai:     { type: integer }
            report: { type: integer }
            auth:   { type: integer }
            total:  { type: integer }
        events:
          type: array
          items:
            $ref: "#/components/schemas/ErrorEvent"

    ChecklistItem:
      type: object
      required: [key, category, label, done]
      properties:
        key:      { type: string }
        category: { type: string }
        label:    { type: string }
        detail:   { type: ["string", "null"] }
        done:     { type: boolean }
        doneAt:   { type: ["string", "null"] }

    ChecklistResponse:
      type: object
      required: [items, completed, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        completed: { type: integer }
        total:     { type: integer }

    ToggleChecklistInput:
      type: object
      required: [done]
      properties:
        done: { type: boolean }

    ChecklistToggleResult:
      type: object
      required: [key, done]
      properties:
        key:  { type: string }
        done: { type: boolean }

    Tester:
      type: object
      required: [id, clerkUserId, role, betaAccess, joinedAt, inspectionCount, feedbackCount]
      properties:
        id:              { type: integer }
        clerkUserId:     { type: string }
        role:            { type: string }
        betaAccess:      { type: boolean }
        lastSeenAt:      { type: ["string", "null"] }
        joinedAt:        { type: string }
        inspectionCount: { type: integer }
        feedbackCount:   { type: integer }

    ToggleAccessInput:
      type: object
      required: [betaAccess]
      properties:
        betaAccess: { type: boolean }

    TesterAccessResult:
      type: object
      required: [id, betaAccess]
      properties:
        id:         { type: integer }
        betaAccess: { type: boolean }

    CreateInviteInput:
      type: object
      properties:
        role:  { type: string, enum: [manager, technician] }
        email: { type: ["string", "null"] }

    Invite:
      type: object
      required: [id, companyId, token, role, createdAt]
      properties:
        id:               { type: integer }
        companyId:        { type: integer }
        token:            { type: string }
        email:            { type: ["string", "null"] }
        role:             { type: string }
        createdByUserId:  { type: ["integer", "null"] }
        acceptedByUserId: { type: ["integer", "null"] }
        expiresAt:        { type: ["string", "null"] }
        acceptedAt:       { type: ["string", "null"] }
        createdAt:        { type: string }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    # ── LEAD SCHEMAS ────────────────────────────────────────────────────────────
    Lead:
      type: object
      required: [id, type, name, email, status, createdAt]
      properties:
        id:          { type: integer }
        type:        { type: string, enum: [demo, contact] }
        name:        { type: string }
        email:       { type: string }
        phone:       { type: ["string", "null"] }
        companyName: { type: ["string", "null"] }
        role:        { type: ["string", "null"] }
        teamSize:    { type: ["string", "null"] }
        message:     { type: ["string", "null"] }
        status:      { type: string }
        source:      { type: ["string", "null"] }
        createdAt:   { type: string }

    LeadInput:
      type: object
      required: [type, name, email]
      properties:
        type:        { type: string, enum: [demo, contact] }
        name:        { type: string, minLength: 1, maxLength: 200 }
        email:       { type: string, format: email, maxLength: 320 }
        phone:       { type: string, maxLength: 50 }
        companyName: { type: string, maxLength: 200 }
        role:        { type: string, maxLength: 100 }
        teamSize:    { type: string, maxLength: 50 }
        message:     { type: string, maxLength: 5000 }
        source:      { type: string, maxLength: 200 }

    # ── SCHEDULE SCHEMAS ────────────────────────────────────────────────────────
    ScheduleEntry:
      type: object
      required: [id, siteAddress, technicianName, status, calendarDate, createdAt]
      properties:
        id:            { type: integer }
        siteAddress:   { type: string }
        clientName:    { type: ["string", "null"] }
        unitNumber:    { type: ["string", "null"], description: "Unit or apartment number for a multi-family property" }
        technicianName: { type: string }
        technicianId:  { type: ["string", "null"] }
        status:        { type: string }
        severity:      { type: ["string", "null"] }
        pestTypes:
          type: array
          items: { type: string }
        scheduledDate: { type: ["string", "null"], description: "ISO-8601 datetime when explicitly scheduled by a manager" }
        calendarDate:  { type: string, description: "YYYY-MM-DD date used to place the entry on the grid (scheduledDate ?? createdAt)" }
        createdAt:     { type: string }
        completedAt:   { type: ["string", "null"] }

    ReassignInput:
      type: object
      properties:
        scheduledDate:   { type: ["string", "null"], description: "ISO-8601 datetime; null clears an existing scheduled date" }
        technicianName:  { type: string, minLength: 1 }
        technicianId:    { type: ["string", "null"] }

    RouteOutlookStatus:
      type: string
      enum: [ok, due-soon, overdue]

    RouteOutlookProduct:
      type: object
      required:
        [
          productId,
          productName,
          targetPest,
          lastAppliedAt,
          daysSinceApplication,
          retreatmentIntervalDays,
          nextEligibleReapplicationDate,
          eligibleNow,
          outlookStatus,
          applicationsLast90Days,
        ]
      properties:
        productId:      { type: integer }
        productName:    { type: string }
        targetPest:     { type: string }
        lastAppliedAt:  { type: string, description: "ISO-8601 datetime of the most recent application at this address" }
        daysSinceApplication: { type: integer }
        retreatmentIntervalDays: { type: ["integer", "null"], description: "Label-defined minimum days before reapplication; null when the label sets no minimum" }
        nextEligibleReapplicationDate: { type: ["string", "null"], description: "YYYY-MM-DD; null when there is no retreatment interval to project from" }
        eligibleNow:    { type: boolean }
        outlookStatus:  { $ref: "#/components/schemas/RouteOutlookStatus" }
        applicationsLast90Days: { type: integer }

    RouteOutlookDetail:
      type: object
      required: [address, calendarDate, products]
      properties:
        address:      { type: string }
        calendarDate: { type: string, description: "YYYY-MM-DD" }
        products:
          type: array
          items:
            $ref: "#/components/schemas/RouteOutlookProduct"

    RouteCalendarStop:
      type: object
      required: [id, siteAddress, technicianName, status, calendarDate, readiness, outlook]
      properties:
        id:            { type: integer }
        siteAddress:   { type: string }
        clientName:    { type: ["string", "null"] }
        unitNumber:    { type: ["string", "null"] }
        technicianName: { type: string }
        technicianId:  { type: ["string", "null"] }
        status:        { type: string }
        severity:      { type: ["string", "null"] }
        pestTypes:
          type: array
          items: { type: string }
        calendarDate:  { type: string, description: "YYYY-MM-DD" }
        readiness:
          type: object
          required: [dailyRigSetUp]
          properties:
            dailyRigSetUp:
              type: ["boolean", "null"]
              description: "null when the stop has no assigned technician"
          description: Route Readiness — has the assigned technician set up their daily rig for this stop's calendar date?
        outlook:
          type: object
          required: [overdueCount, dueSoonCount, okCount, hasOutlookData]
          properties:
            overdueCount:    { type: integer }
            dueSoonCount:    { type: integer }
            okCount:         { type: integer }
            hasOutlookData:  { type: boolean, description: "false when no treatment history exists yet at this address" }
          description: Rolled-up Route Chemical Outlook counts for this stop's address

    RouteCalendarDay:
      type: object
      required: [date, stops]
      properties:
        date: { type: string, description: "YYYY-MM-DD" }
        stops:
          type: array
          items:
            $ref: "#/components/schemas/RouteCalendarStop"

    RecentInspectionSummary:
      type: object
      required: [id, status, pestTypes, technicianName, calendarDate, findingsCount]
      properties:
        id:              { type: integer }
        status:          { type: string }
        severity:        { type: ["string", "null"] }
        pestTypes:
          type: array
          items: { type: string }
        technicianName:  { type: string }
        calendarDate:    { type: string, description: "YYYY-MM-DD" }
        findingsCount:   { type: integer }
        completedAt:     { type: ["string", "null"] }

    PropertyNoteSummary:
      type: object
      required: [id, note, createdAt]
      properties:
        id:         { type: integer }
        note:       { type: string }
        zone:       { type: ["string", "null"] }
        category:   { type: ["string", "null"] }
        authorName: { type: ["string", "null"] }
        createdAt:  { type: string }

    HistoricalFinding:
      type: object
      required: [category, description, frequency]
      properties:
        category:    { type: string }
        description: { type: string }
        frequency:   { type: integer }
        severity:    { type: string, enum: [low, medium, high] }

    StopHistoryPhoto:
      type: object
      required: [id, url, inspectionId, calendarDate, createdAt]
      properties:
        id:           { type: integer }
        url:          { type: string }
        filename:     { type: ["string", "null"] }
        caption:      { type: ["string", "null"] }
        inspectionId: { type: integer }
        calendarDate: { type: string, description: "YYYY-MM-DD" }
        createdAt:    { type: string }

    PropertyProfile:
      type: object
      required: [address, addressKey, recentInspections, historicalPhotos, materialHistory, activeBaitStations, historicalPests, historicalFindings, notes]
      properties:
        address:    { type: string }
        addressKey: { type: string }
        recentInspections:
          type: array
          items:
            $ref: "#/components/schemas/RecentInspectionSummary"
        historicalPhotos:
          type: array
          items:
            $ref: "#/components/schemas/StopHistoryPhoto"
        materialHistory:
          type: array
          items:
            $ref: "#/components/schemas/ChemicalLedgerEntry"
        activeBaitStations: { type: integer }
        historicalPests:
          type: array
          items: { type: string }
        historicalFindings:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalFinding"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PropertyNoteSummary"

    PestPacLegacyNote:
      type: object
      required: [id, note, category, authorName, createdAt]
      properties:
        id:         { type: string }
        note:       { type: string }
        category:   { type: ["string", "null"] }
        authorName: { type: ["string", "null"] }
        createdAt:  { type: ["string", "null"], format: date-time }

    PestPacStopHistory:
      type: object
      required: [status, notes]
      properties:
        status:
          type: string
          enum: [available, disabled, not_configured, not_mapped, unavailable]
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PestPacLegacyNote"

    StopHistory:
      allOf:
        - $ref: "#/components/schemas/PropertyProfile"
        - type: object
          required: [stopId, pestPacHistory]
          properties:
            stopId: { type: integer }
            pestPacHistory:
              $ref: "#/components/schemas/PestPacStopHistory"

    PropertyVisitUnit:
      type: object
      required: [id, technicianName, status, pestTypes, findingsCount, mediaCount]
      properties:
        id:             { type: integer }
        unitNumber:     { type: ["string", "null"] }
        clientName:     { type: ["string", "null"] }
        technicianName: { type: string }
        technicianId:   { type: ["string", "null"] }
        status:         { type: string }
        severity:       { type: ["string", "null"] }
        pestTypes:
          type: array
          items: { type: string }
        notes:          { type: ["string", "null"] }
        visitPurpose:   { type: ["string", "null"] }
        findingsCount:  { type: integer }
        mediaCount:     { type: integer }
        completedAt:    { type: ["string", "null"] }

    ChemicalLedgerCompliance:
      type: object
      required: [retreatmentIntervalDays, priorApplicationAt, daysSincePrior, isCompliant, nextEligibleReapplicationDate, eligibleNow]
      properties:
        retreatmentIntervalDays: { type: ["integer", "null"], description: "Label-defined minimum days before reapplication; null when the label sets no minimum" }
        priorApplicationAt:      { type: ["string", "null"], description: "ISO-8601 datetime of the most recent PRIOR application of the same product at this address; null when there is none" }
        daysSincePrior:          { type: ["integer", "null"] }
        isCompliant:             { type: boolean }
        nextEligibleReapplicationDate: { type: ["string", "null"] }
        eligibleNow:             { type: boolean }

    ChemicalLedgerEntry:
      type: object
      required: [id, inspectionId, productId, productName, targetPest, siteClassification, appliedAt, compliance]
      properties:
        id:                    { type: integer }
        inspectionId:          { type: integer }
        productId:             { type: integer }
        productName:           { type: string }
        epaRegistrationNumber: { type: ["string", "null"] }
        targetPest:            { type: string }
        siteClassification:    { type: string }
        areaSqft:              { type: ["number", "null"] }
        linearFt:              { type: ["number", "null"] }
        totalProductOz:        { type: ["number", "null"] }
        equipmentUsed:         { type: ["string", "null"] }
        notes:                 { type: ["string", "null"] }
        appliedAt:             { type: string }
        compliance:
          $ref: "#/components/schemas/ChemicalLedgerCompliance"

    PropertyVisitDetail:
      type: object
      required: [address, calendarDate, units, chemicalLedger]
      properties:
        address:      { type: string }
        calendarDate: { type: string, description: "YYYY-MM-DD" }
        units:
          type: array
          items:
            $ref: "#/components/schemas/PropertyVisitUnit"
        chemicalLedger:
          type: array
          items:
            $ref: "#/components/schemas/ChemicalLedgerEntry"

    # ── INSPECTION SCHEMAS ──────────────────────────────────────────────────────
    Inspection:
      type: object
      required: [id, siteAddress, status, technicianName, createdAt]
      properties:
        id:          { type: integer }
        siteAddress: { type: string }
        clientName:  { type: ["string", "null"] }
        unitNumber:  { type: ["string", "null"] }
        technicianName: { type: string }
        technicianId: { type: ["string", "null"] }
        status:      { type: string }
        pestTypes:
          type: array
          items: { type: string }
        severity:    { type: ["string", "null"] }
        notes:       { type: ["string", "null"] }
        visitPurpose:
          type: ["string", "null"]
          description: >-
            Freeform reason for the visit (e.g. "Routine Inspection",
            "Callback", "Initial Service"). Not a strict enum so it can also
            be populated by a future enterprise-routing import. Null for
            historical rows and older clients that predate this field.
        mediaCount:  { type: integer }
        findingsCount: { type: integer }
        media:
          type: array
          items:
            $ref: "#/components/schemas/InspectionMedia"
        aiAnalysisId: { type: ["integer", "null"] }
        createdAt:   { type: string }
        completedAt: { type: ["string", "null"] }

    CompleteInspectionResult:
      type: object
      required: [inspection, alreadyCompleted, finalization]
      properties:
        inspection:
          $ref: "#/components/schemas/Inspection"
        reportId: { type: ["integer", "null"] }
        alreadyCompleted:
          type: boolean
          description: True when the inspection was already completed (safe no-op).
        finalization:
          type: string
          enum: [started, skipped]
          description: >
            "started" when the background finalization pipeline (AI narrative,
            customer summary draft, Opportunity Intelligence, scorecard) was
            kicked off by this call.

    InspectionInput:
      type: object
      required: [siteAddress, technicianName]
      properties:
        siteAddress:    { type: string }
        clientName:     { type: string }
        unitNumber:     { type: ["string", "null"] }
        technicianName: { type: string }
        technicianId:   { type: string }
        notes:          { type: string }
        visitPurpose:   { type: string }
        pestTypes:
          type: array
          items: { type: string }
        clientKey:
          type: string
          description: >-
            Client-generated idempotency key (UUID). Retrying a create with the
            same key returns the previously created inspection (200) instead of
            duplicating it — required for offline-first sync retries.

    InspectionUpdate:
      type: object
      properties:
        status:      { type: string }
        notes:       { type: string }
        severity:    { type: string }
        pestTypes:
          type: array
          items: { type: string }
        completedAt: { type: string }
        unitNumber:  { type: ["string", "null"] }
        visitPurpose: { type: ["string", "null"] }

    InspectionMedia:
      type: object
      required: [id, inspectionId, mediaType, url, createdAt]
      properties:
        id:           { type: integer }
        inspectionId: { type: integer }
        mediaType:    { type: string }
        url:          { type: string }
        filename:     { type: ["string", "null"] }
        caption:      { type: ["string", "null"] }
        durationSec:  { type: ["integer", "null"] }
        captureSource:   { type: string }
        qualityScore:    { type: ["integer", "null"] }
        captureMetadata:
          type: ["object", "null"]
          additionalProperties: true
        unitNumber:   { type: ["string", "null"] }
        capturedAt:   { type: ["string", "null"], format: date-time }
        createdAt:    { type: string, format: date-time }

    MediaInput:
      type: object
      required: [mediaType, url]
      properties:
        mediaType:   { type: string }
        url:         { type: string }
        filename:    { type: string }
        caption:     { type: string }
        durationSec: { type: integer }
        captureSource: { type: string }
        qualityScore:  { type: integer }
        captureMetadata:
          type: object
          additionalProperties: true
        unitNumber: { type: ["string", "null"] }
        capturedAt: { type: string, format: date-time }

    # ── ANALYSIS SCHEMAS ────────────────────────────────────────────────────────
    AnalysisResult:
      type: object
      required: [id, inspectionId, status, createdAt]
      properties:
        id:           { type: integer }
        inspectionId: { type: integer }
        status:       { type: string }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        recommendations:
          type: array
          items: { type: string }
        videoEvidence:
          type: array
          items:
            type: object
            required: [url, frameAnalysisStatus]
            properties:
              url:         { type: string }
              filename:    { type: ["string", "null"] }
              durationSec: { type: ["integer", "null"] }
              label:       { type: ["string", "null"] }
              frameAnalysisStatus: { type: string }
        analyzedImagePaths:
          type: array
          items: { type: string }
        photoOutcomes:
          type: array
          description: Per-photo provider outcome from the most recent analysis run.
          items:
            type: object
            required: [imagePath, status]
            properties:
              imagePath: { type: string }
              status:
                type: string
                enum: [completed, failed, deferred, rate_limited]
        photoZones:
          type: object
          additionalProperties: { type: string }
        coverage:
          oneOf:
            - $ref: "#/components/schemas/CoverageSnapshot"
            - type: "null"
        evidence:
          $ref: "#/components/schemas/EvidenceSummary"
        guidance:
          $ref: "#/components/schemas/GuidanceSummary"
        memory:
          description: >-
            Inspection Memory — prior-visit context for this address (same
            company) plus gap highlights vs. what has been captured today. Only
            populated on single-inspection scopes (POST /analyze, GET /:id, and
            GET /?inspectionId=); null on the unfiltered list and other paths.
          oneOf:
            - $ref: "#/components/schemas/InspectionMemory"
            - type: "null"
        overallConfidence: { type: ["number", "null"] }
        riskLevel:    { type: ["string", "null"] }
        technicianFeedback: { type: ["string", "null"] }
        feedbackStatus: { type: ["string", "null"] }
        analysisErrors: { type: ["integer", "null"] }
        failureReason:
          type: ["string", "null"]
          description: >-
            Human-readable reason the analysis was skipped or failed (e.g.
            "Photos could not be processed by the AI service"). Absent when
            analysis succeeded or no specific reason was recorded.
        createdAt:    { type: string }

    CoverageZone:
      type: object
      required: [slug, label]
      properties:
        slug:  { type: string }
        label: { type: string }

    CoverageSnapshot:
      type: object
      required: [propertyType, completenessPct, requiredZones, coveredRequired, uncoveredRequired, suggested]
      properties:
        propertyType:    { type: string }
        completenessPct: { type: number }
        requiredZones:
          type: array
          items: { $ref: "#/components/schemas/CoverageZone" }
        coveredRequired:
          type: array
          items: { $ref: "#/components/schemas/CoverageZone" }
        uncoveredRequired:
          type: array
          items: { $ref: "#/components/schemas/CoverageZone" }
        suggested:
          type: array
          items: { $ref: "#/components/schemas/CoverageZone" }

    EvidenceCount:
      type: object
      required: [key, label, count]
      properties:
        key:   { type: string }
        label: { type: string }
        count: { type: integer }

    EvidenceGroup:
      type: object
      required: [key, label, total, items]
      properties:
        key:   { type: string }
        label: { type: string }
        total: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/EvidenceCount" }

    EvidenceSummary:
      type: object
      required: [totalEvidence, photoEvidence, videoEvidence, groups]
      properties:
        totalEvidence: { type: integer }
        photoEvidence: { type: integer }
        videoEvidence: { type: integer }
        groups:
          type: array
          items: { $ref: "#/components/schemas/EvidenceGroup" }

    GuidanceRecommendation:
      type: object
      required: [id, category, priority, title, reason]
      properties:
        id:       { type: string }
        category: { type: string }
        priority: { type: integer }
        title:    { type: string }
        reason:   { type: string }
        zone:     { type: ["string", "null"] }

    GuidanceSummary:
      type: object
      required: [next, queue, remaining]
      description: >-
        Live Guidance Engine output. `next` is the single highest-priority next
        inspection task (null when nothing is pending). `queue` is the full
        prioritized list, sorted by priority, and includes `next` as its first
        element. `remaining` is the number of tasks AFTER `next`
        (queue.length - 1, min 0) — use it to drive an "N more" hint.
      properties:
        next:
          oneOf:
            - $ref: "#/components/schemas/GuidanceRecommendation"
            - type: "null"
        queue:
          type: array
          items: { $ref: "#/components/schemas/GuidanceRecommendation" }
        remaining: { type: integer }

    InspectionMemory:
      type: object
      description: >-
        Prior-visit context for the CURRENT inspection at the same physical
        address (same company), aggregated verbatim from earlier inspections'
        analysis rows — never fabricated. `highlights` are gap alerts comparing
        remembered signals against what has been captured today, and they feed
        the Live Guidance Engine so the next task can be memory-driven.
      required:
        [hasPriorVisits, priorVisitCount, lastVisitDate, pestActivity, baitStations, entryPoints, recommendations, treatments, highlights]
      properties:
        hasPriorVisits:  { type: boolean }
        priorVisitCount: { type: integer }
        lastVisitDate:   { type: ["string", "null"] }
        pestActivity:
          type: array
          items: { $ref: "#/components/schemas/MemoryPestActivity" }
        baitStations:
          type: array
          items: { $ref: "#/components/schemas/MemoryBaitStation" }
        entryPoints:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntryPoint" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/MemoryNote" }
        treatments:
          type: array
          items: { $ref: "#/components/schemas/MemoryNote" }
        highlights:
          type: array
          items: { $ref: "#/components/schemas/MemoryHighlight" }

    MemoryPestActivity:
      type: object
      required: [key, label, zone, severity, visits, lastSeen]
      properties:
        key:      { type: string }
        label:    { type: string }
        zone:     { type: ["string", "null"] }
        severity: { type: string }
        visits:   { type: integer }
        lastSeen: { type: ["string", "null"] }

    MemoryBaitStation:
      type: object
      required: [key, description, zone, lastSeen]
      properties:
        key:         { type: string }
        description: { type: string }
        zone:        { type: ["string", "null"] }
        lastSeen:    { type: ["string", "null"] }

    MemoryEntryPoint:
      type: object
      required: [key, description, zone, lastSeen]
      properties:
        key:         { type: string }
        description: { type: string }
        zone:        { type: ["string", "null"] }
        lastSeen:    { type: ["string", "null"] }

    MemoryNote:
      type: object
      required: [key, text, lastSeen]
      properties:
        key:      { type: string }
        text:     { type: string }
        lastSeen: { type: ["string", "null"] }

    MemoryHighlight:
      type: object
      required: [id, type, zone, label, message, lastSeen]
      properties:
        id:      { type: string }
        type:
          type: string
          enum: [area_not_inspected, bait_station_missing, rodent_area_not_photographed]
        zone:    { type: ["string", "null"] }
        label:   { type: string }
        message: { type: string }
        lastSeen: { type: ["string", "null"] }

    Finding:
      type: object
      additionalProperties: false
      required:
        - id
        - category
        - description
        - confidence
        - severity
        - location
        - imageUrl
        - treatment
        - exclusionOpportunity
      properties:
        id:            { type: integer }
        category:      { type: string }
        description:   { type: string }
        confidence:    { type: number }
        severity:      { type: string }
        location:      { type: ["string", "null"] }
        imageUrl:      { type: ["string", "null"] }
        treatment:     { type: ["string", "null"] }
        exclusionOpportunity: { type: ["boolean", "null"] }
        evidenceQuality:
          type: ["string", "null"]
          enum: [excellent, good, fair, null]
        possiblePest: { type: ["string", "null"] }
        species:       { type: ["string", "null"] }
        lifeStage:     { type: ["string", "null"] }
        conduciveCondition: { type: ["string", "null"] }
        harborage:     { type: ["string", "null"] }
        moisture:      { type: ["string", "null"] }
        structuralIssue: { type: ["string", "null"] }
        measurementEstimate:
          oneOf:
            - type: object
              additionalProperties: false
              required: [confidence, source]
              properties:
                linearFt: { type: ["number", "null"] }
                gapWidthIn: { type: ["number", "null"] }
                heightFt: { type: ["number", "null"] }
                confidence: { type: number }
                source:
                  type: string
                  enum: [ai_vision_estimate]
            - type: "null"
        zone:          { type: ["string", "null"] }
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [species, confidence]
            properties:
              species: { type: string }
              confidence: { type: number }
        confidenceLabel:
          type: string
          enum: [identified, possible, unidentified]
        reviewStatus:
          type: string
          enum: [pending, accepted, corrected, dismissed]
        technicianSpecies: { type: ["string", "null"] }
        technicianCorrectionNotes: { type: ["string", "null"] }

    FeedbackInput:
      type: object
      required: [feedbackStatus]
      properties:
        feedbackStatus: { type: string }
        technicianFeedback: { type: string }

    AnalyzeInspectionInput:
      type: object
      required: [inspectionId]
      properties:
        inspectionId: { type: integer }
        images:
          type: array
          items:
            type: object
            required: [imageUrl]
            properties:
              imageUrl: { type: string }
              label:    { type: ["string", "null"] }
        technicianFindings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        videos:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url:         { type: string }
              filename:    { type: ["string", "null"] }
              durationSec: { type: ["integer", "null"] }
              label:       { type: ["string", "null"] }
        draft:
          type: boolean
          description: >
            Live-capture mode: analyze photos but defer Opportunity
            Intelligence and scorecard computation until the technician
            explicitly completes the inspection. Defaults to false.

    AnalysisSummary:
      type: object
      required: [totalAnalyses, avgConfidence, topFindings, findingsByCategory]
      properties:
        totalAnalyses:     { type: integer }
        avgConfidence:     { type: number }
        topFindings:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category: { type: string }
              count:    { type: integer }
        findingsByCategory:
          type: array
          items:
            type: object
            required: [category, count, percentage]
            properties:
              category:   { type: string }
              count:      { type: integer }
              percentage: { type: number }

    # ── DATASET SCHEMAS ─────────────────────────────────────────────────────────
    DatasetImage:
      type: object
      required: [id, category, title, imageUrl, pestType, createdAt]
      properties:
        id:          { type: integer }
        category:    { type: string }
        title:       { type: string }
        description: { type: ["string", "null"] }
        imageUrl:    { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        pestType:    { type: string }
        severity:    { type: ["string", "null"] }
        location:    { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        createdAt:   { type: string }

    DatasetPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatasetImage"
        total:  { type: integer }
        page:   { type: integer }
        limit:  { type: integer }

    DatasetCategory:
      type: object
      required: [name, count, slug]
      properties:
        name:  { type: string }
        slug:  { type: string }
        count: { type: integer }
        icon:  { type: ["string", "null"] }

    # ── INTELLIGENCE DATASET SCHEMAS ────────────────────────────────────────────
    AiPrediction:
      type: object
      required: [confidence, tags]
      properties:
        category:                   { type: ["string", "null"] }
        subcategory:                { type: ["string", "null"] }
        confidence:                 { type: number }
        tags:
          type: array
          items: { type: string }
        possiblePest:               { type: ["string", "null"] }
        possibleConduciveCondition: { type: ["string", "null"] }
        possibleEntryPoint:         { type: ["string", "null"] }
        suggestedCorrectiveAction:  { type: ["string", "null"] }
        rationale:                  { type: ["string", "null"] }

    IntelligenceTag:
      type: object
      required: [tag, source]
      properties:
        tag:    { type: string }
        source: { type: string }

    IntelligenceRecord:
      type: object
      required:
        [id, imageUrl, aiPrediction, verificationLevel, status,
         approvedForTraining, createdBy, tags, confirmVotes, disputeVotes,
         createdAt, updatedAt]
      properties:
        id:                         { type: integer }
        imageUrl:                   { type: string }
        thumbnailUrl:               { type: ["string", "null"] }
        mediaType:                  { type: string, enum: [photo, video] }
        aiPrediction:
          $ref: "#/components/schemas/AiPrediction"
        aiConfidence:               { type: ["number", "null"] }
        category:                   { type: ["string", "null"] }
        subcategory:                { type: ["string", "null"] }
        possiblePest:               { type: ["string", "null"] }
        possibleConduciveCondition: { type: ["string", "null"] }
        possibleEntryPoint:         { type: ["string", "null"] }
        correctiveAction:           { type: ["string", "null"] }
        severity:                   { type: ["string", "null"] }
        whatIsShown:                { type: ["string", "null"] }
        whyItMatters:               { type: ["string", "null"] }
        notes:                      { type: ["string", "null"] }
        treatmentOutcome:           { type: ["string", "null"] }
        daysUntilFollowup:          { type: ["integer", "null"] }
        verificationLevel:          { type: integer }
        status:                     { type: string }
        approvedForTraining:        { type: boolean }
        aiCorrected:                { type: ["boolean", "null"] }
        createdBy:                  { type: integer }
        confirmedBy:                { type: ["integer", "null"] }
        reviewedBy:                 { type: ["integer", "null"] }
        tags:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceTag" }
        confirmVotes:               { type: integer }
        disputeVotes:               { type: integer }
        myVote:                     { type: ["string", "null"] }
        createdAt:                  { type: string }
        updatedAt:                  { type: string }
        confirmedAt:                { type: ["string", "null"] }
        reviewedAt:                 { type: ["string", "null"] }

    IntelligenceRecordPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceRecord" }
        total: { type: integer }
        page:  { type: integer }
        limit: { type: integer }

    IntelligenceSubcategory:
      type: object
      required: [slug, label, count]
      properties:
        slug:  { type: string }
        label: { type: string }
        count: { type: integer }

    IntelligenceCategory:
      type: object
      required: [slug, label, description, count, subcategories]
      properties:
        slug:        { type: string }
        label:       { type: string }
        description: { type: string }
        count:       { type: integer }
        subcategories:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceSubcategory" }

    IntelligenceSettings:
      type: object
      required: [sharingEnabled]
      properties:
        sharingEnabled: { type: boolean }

    IntelligenceSettingsInput:
      type: object
      required: [sharingEnabled]
      properties:
        sharingEnabled: { type: boolean }

    IntelligenceRecordInput:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:     { type: string, minLength: 1 }
        thumbnailUrl: { type: string }

    IntelligenceConfirmInput:
      type: object
      required: [category]
      properties:
        category:                   { type: string, minLength: 1 }
        subcategory:                { type: string }
        possiblePest:               { type: string }
        possibleConduciveCondition: { type: string }
        possibleEntryPoint:         { type: string }
        correctiveAction:           { type: string }
        severity:                   { type: string, enum: [low, moderate, high, critical] }
        whatIsShown:                { type: string }
        whyItMatters:               { type: string }
        notes:                      { type: string }
        treatmentOutcome:           { type: string, enum: [resolved, improved, unchanged, worsened, pending, not_applicable] }
        daysUntilFollowup:          { type: integer, minimum: 0 }
        tags:
          type: array
          items: { type: string }

    IntelligenceVoteInput:
      type: object
      required: [vote]
      properties:
        vote: { type: string, enum: [confirm, dispute] }

    IntelligenceReviewInput:
      type: object
      required: [action]
      properties:
        action:                     { type: string, enum: [approve, reject, edit, expert_verify] }
        comment:                    { type: string }
        category:                   { type: string }
        subcategory:                { type: string }
        possiblePest:               { type: string }
        possibleConduciveCondition: { type: string }
        possibleEntryPoint:         { type: string }
        correctiveAction:           { type: string }
        severity:                   { type: string, enum: [low, moderate, high, critical] }
        whatIsShown:                { type: string }
        whyItMatters:               { type: string }
        notes:                      { type: string }
        treatmentOutcome:           { type: string, enum: [resolved, improved, unchanged, worsened, pending, not_applicable] }
        daysUntilFollowup:          { type: integer, minimum: 0 }
        force:                      { type: boolean, description: "Pass true to override a prior rejection. Required when re-approving a rejected record." }

    IntelligenceCategoryStat:
      type: object
      required: [slug, label, count]
      properties:
        slug:  { type: string }
        label: { type: string }
        count: { type: integer }

    IntelligenceLevelStat:
      type: object
      required: [level, count]
      properties:
        level: { type: integer }
        count: { type: integer }

    IntelligenceGrowthPoint:
      type: object
      required: [date, total, approved]
      properties:
        date:     { type: string }
        total:    { type: integer }
        approved: { type: integer }

    IntelligenceContributor:
      type: object
      required: [userId, contributions, approved]
      properties:
        userId:        { type: integer }
        contributions: { type: integer }
        approved:      { type: integer }

    IntelligenceAnalytics:
      type: object
      required:
        [totalRecords, approvedRecords, approvedForTraining, pendingReview,
         aiAccuracyRate, aiVsTechnicianAgreementRate, technicianCorrectionRate,
         managerApprovalRate, mostSubmittedCategories, mostVerifiedCategories,
         byVerificationLevel, datasetGrowth, topContributors, sharingEnabled]
      properties:
        totalRecords:                { type: integer }
        approvedRecords:             { type: integer }
        approvedForTraining:         { type: integer }
        pendingReview:               { type: integer }
        aiAccuracyRate:              { type: number }
        aiVsTechnicianAgreementRate: { type: number }
        technicianCorrectionRate:    { type: number }
        managerApprovalRate:         { type: number }
        sharingEnabled:              { type: boolean }
        mostSubmittedCategories:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceCategoryStat" }
        mostVerifiedCategories:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceCategoryStat" }
        byVerificationLevel:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceLevelStat" }
        datasetGrowth:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceGrowthPoint" }
        topContributors:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceContributor" }

    # ── REPORT SCHEMAS ──────────────────────────────────────────────────────────
    Report:
      type: object
      required: [id, inspectionId, title, status, createdAt]
      properties:
        id:              { type: integer }
        inspectionId:    { type: integer }
        title:           { type: string }
        clientName:      { type: ["string", "null"] }
        siteAddress:     { type: string }
        status:          { type: string }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        recommendations:
          type: array
          items: { type: string }
        treatmentNotes:  { type: ["string", "null"] }
        exclusionOpportunities:
          type: array
          items: { type: string }
        technicianName:  { type: string }
        inspectionDate:  { type: string }
        severity:        { type: ["string", "null"] }
        pdfUrl:          { type: ["string", "null"] }
        aiNarrative:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AiReportNarrative"
        evidenceRecovery:
          $ref: "#/components/schemas/ReportEvidenceRecovery"
        createdAt:       { type: string }

    ReportEvidenceRecovery:
      type: object
      required: [syncedPhotoCount, needsRegeneration, latestEvidenceAt]
      description: >-
        Present on report-detail responses. Signals when photo media or analysis
        finished syncing after the current narrative was generated.
      properties:
        syncedPhotoCount: { type: integer, minimum: 0 }
        needsRegeneration: { type: boolean }
        latestEvidenceAt: { type: ["string", "null"], format: date-time }

    AiReportNarrative:
      type: object
      required: [executiveSummary, inspectionFindings, evidenceObserved, pestActivityAssessment, structuralDeficiencies, sanitationConcerns, recommendedCorrectiveActions, monitoringRecommendations, followUpSchedule, technicianNotes, managerReviewNotes, propertyType, model, generatedAt]
      properties:
        executiveSummary:             { type: string }
        inspectionFindings:           { type: string }
        evidenceObserved:             { type: string }
        pestActivityAssessment:       { type: string }
        structuralDeficiencies:       { type: string }
        sanitationConcerns:           { type: string }
        recommendedCorrectiveActions: { type: array, items: { type: string } }
        monitoringRecommendations:    { type: array, items: { type: string } }
        followUpSchedule:             { type: string }
        technicianNotes:              { type: string }
        managerReviewNotes:           { type: string }
        propertyType:                 { type: string }
        model:                        { type: string }
        generatedAt:                  { type: string }
        # Optional for backward compatibility with narratives generated before
        # these sections existed; always present on new generations.
        conduciveConditions:          { type: string }
        customerRecommendations:      { type: array, items: { type: string } }

    GenerateNarrativeInput:
      type: object
      properties:
        refreshFindings:
          type: boolean
          description: >-
            When true, re-snapshot the report's findings and recommendations
            from the inspection's latest AI analysis before generating the
            narrative (used by the live report builder).

    ReportInput:
      type: object
      required: [inspectionId, title]
      properties:
        inspectionId:   { type: integer }
        title:          { type: string }
        treatmentNotes: { type: string }
        includePhotos:  { type: boolean }
        includeAiFindings: { type: boolean }

    # ── ANALYTICS SCHEMAS ───────────────────────────────────────────────────────
    AnalyticsDashboard:
      type: object
      required: [totalInspections, completedInspections, openInspections, avgFindingsPerInspection, topPestTypes, recentActivity, inspectionsByStatus, monthlyInspections]
      properties:
        totalInspections:          { type: integer }
        completedInspections:      { type: integer }
        openInspections:           { type: integer }
        avgFindingsPerInspection:  { type: number }
        totalReports:              { type: integer }
        photosCaptured:            { type: integer }
        videosCaptured:            { type: integer }
        aiAnalysesCompleted:       { type: integer }
        avgAiConfidence:           { type: number }
        topPestTypes:
          type: array
          items:
            type: object
            required: [pestType, count]
            properties:
              pestType: { type: string }
              count:    { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        inspectionsByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count:  { type: integer }
        monthlyInspections:
          type: array
          items:
            $ref: "#/components/schemas/TrendDataPoint"

    TrendDataPoint:
      type: object
      required: [date, value]
      properties:
        date:     { type: string }
        value:    { type: number }
        category: { type: ["string", "null"] }
        label:    { type: ["string", "null"] }

    ActivityItem:
      type: object
      required: [id, type, description, technicianName, createdAt]
      properties:
        id:             { type: integer }
        type:           { type: string }
        description:    { type: string }
        technicianName: { type: string }
        siteAddress:    { type: ["string", "null"] }
        createdAt:      { type: string }

    TechnicianPerformance:
      type: object
      required: [technicianName, inspectionCount, avgFindingsPerInspection, avgAiConfidence, completionRate]
      properties:
        technicianName:             { type: string }
        technicianId:               { type: ["string", "null"] }
        inspectionCount:            { type: integer }
        avgFindingsPerInspection:   { type: number }
        avgAiConfidence:            { type: number }
        completionRate:             { type: number }
        badge:                      { type: ["string", "null"] }

    InfestationRisk:
      type: object
      required: [overallRisk, riskByPestType, riskTrend, highRiskSites]
      properties:
        overallRisk:   { type: string }
        riskScore:     { type: number }
        riskByPestType:
          type: array
          items:
            type: object
            required: [pestType, riskLevel, count]
            properties:
              pestType:  { type: string }
              riskLevel: { type: string }
              count:     { type: integer }
        riskTrend:
          type: array
          items:
            $ref: "#/components/schemas/TrendDataPoint"
        highRiskSites:
          type: array
          items:
            type: object
            required: [siteAddress, riskScore, lastInspected]
            properties:
              siteAddress:   { type: string }
              riskScore:     { type: number }
              lastInspected: { type: string }

    # ── INTELLIGENCE SCHEMAS ────────────────────────────────────────────────────
    OpportunityItem:
      type: object
      required: [id, inspectionId, siteAddress, propertyType, type, typeLabel, category, finding, severity, confidence, recommendation, documented]
      properties:
        id:            { type: string }
        inspectionId:  { type: integer }
        siteAddress:   { type: string }
        propertyType:  { type: string }
        type:          { type: string }
        typeLabel:     { type: string }
        category:      { type: string }
        finding:       { type: string }
        location:      { type: ["string", "null"] }
        imageUrl:      { type: ["string", "null"] }
        severity:      { type: string }
        confidence:    { type: number }
        recommendation: { type: string }
        documented:    { type: boolean }

    OpportunityIntelligence:
      type: object
      required: [totalOpportunities, exclusionCount, structuralCount, sanitationCount, moistureCount, followUpCount, unreportedCount, highRiskPropertyCount, byType, opportunities]
      properties:
        totalOpportunities:    { type: integer }
        exclusionCount:        { type: integer }
        structuralCount:       { type: integer }
        sanitationCount:       { type: integer }
        moistureCount:         { type: integer }
        followUpCount:         { type: integer }
        unreportedCount:       { type: integer }
        highRiskPropertyCount: { type: integer }
        byType:
          type: array
          items:
            type: object
            required: [type, label, count]
            properties:
              type:  { type: string }
              label: { type: string }
              count: { type: integer }
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/OpportunityItem"

    CallbackChain:
      type: object
      required: [id, finding, outcome, outcomeLabel, propertyType, pestType, createdAt]
      properties:
        id:                 { type: integer }
        finding:            { type: string }
        recommendation:     { type: ["string", "null"] }
        followUpVisit:      { type: ["string", "null"] }
        outcome:            { type: string }
        outcomeLabel:       { type: string }
        propertyType:       { type: string }
        pestType:           { type: string }
        callbackCause:      { type: ["string", "null"] }
        callbackCauseLabel: { type: ["string", "null"] }
        createdAt:          { type: string }

    CallbackIntelligence:
      type: object
      required: [totalChains, totalCallbacks, callbackRate, resolvedCount, activityReducedCount, topCauses, recurringFindings, byPropertyType, byPestType, pestRecurrence, trend, conduciveConditions, chains]
      properties:
        totalChains:          { type: integer }
        totalCallbacks:       { type: integer }
        callbackRate:         { type: integer }
        resolvedCount:        { type: integer }
        activityReducedCount: { type: integer }
        topCauses:
          type: array
          items:
            type: object
            required: [cause, label, count]
            properties:
              cause: { type: string }
              label: { type: string }
              count: { type: integer }
        recurringFindings:
          type: array
          items:
            type: object
            required: [finding, count]
            properties:
              finding: { type: string }
              count:   { type: integer }
        byPropertyType:
          type: array
          items:
            type: object
            required: [propertyType, total, callbacks]
            properties:
              propertyType: { type: string }
              total:        { type: integer }
              callbacks:    { type: integer }
        byPestType:
          type: array
          items:
            type: object
            required: [pestType, total, callbacks]
            properties:
              pestType:  { type: string }
              total:     { type: integer }
              callbacks: { type: integer }
        pestRecurrence:
          type: array
          items:
            type: object
            required: [pestType, count, recurrenceRate]
            properties:
              pestType:       { type: string }
              count:          { type: integer }
              recurrenceRate: { type: integer }
        trend:
          type: array
          items:
            type: object
            required: [month, label, total, callbacks]
            properties:
              month:     { type: string }
              label:     { type: string }
              total:     { type: integer }
              callbacks: { type: integer }
        conduciveConditions:
          type: array
          items:
            type: object
            required: [condition, count]
            properties:
              condition: { type: string }
              count:     { type: integer }
        chains:
          type: array
          items:
            $ref: "#/components/schemas/CallbackChain"

    HighRiskProperty:
      type: object
      required: [inspectionId, siteAddress, propertyType, riskScore, conditions, findingCount]
      properties:
        inspectionId: { type: integer }
        siteAddress:  { type: string }
        propertyType: { type: string }
        riskScore:    { type: number }
        conditions:
          type: array
          items: { type: string }
        findingCount: { type: integer }

    PropertyRiskInsights:
      type: object
      required: [riskIndicators, recurringConditions, highRiskProperties, riskTrend]
      properties:
        riskIndicators:
          type: array
          items:
            type: object
            required: [condition, count]
            properties:
              condition: { type: string }
              count:     { type: integer }
        recurringConditions:
          type: array
          items:
            type: object
            required: [condition, count]
            properties:
              condition: { type: string }
              count:     { type: integer }
        highRiskProperties:
          type: array
          items:
            $ref: "#/components/schemas/HighRiskProperty"
        riskTrend:
          type: array
          items:
            type: object
            required: [month, label, value]
            properties:
              month: { type: string }
              label: { type: string }
              value: { type: integer }

    # ── BRANDING SCHEMAS ────────────────────────────────────────────────────────
    BrandingProfile:
      type: object
      required: [id, name, isDefault, isActive, companyName, poweredByVisible, createdAt, updatedAt]
      properties:
        id:                  { type: integer }
        name:                { type: string }
        isDefault:           { type: boolean }
        isActive:            { type: boolean }
        companyName:         { type: string }
        tagline:             { type: ["string", "null"] }
        companyAddress:      { type: ["string", "null"] }
        companyPhone:        { type: ["string", "null"] }
        companyEmail:        { type: ["string", "null"] }
        companyWebsite:      { type: ["string", "null"] }
        licenseNumber:       { type: ["string", "null"] }
        logoUrl:             { type: ["string", "null"] }
        appIconUrl:          { type: ["string", "null"] }
        primaryColor:        { type: ["string", "null"] }
        secondaryColor:      { type: ["string", "null"] }
        accentColor:         { type: ["string", "null"] }
        reportFooterText:    { type: ["string", "null"] }
        supportInfo:         { type: ["string", "null"] }
        signatureDisclaimer: { type: ["string", "null"] }
        emailSenderName:     { type: ["string", "null"] }
        emailReplyTo:        { type: ["string", "null"] }
        emailFooter:         { type: ["string", "null"] }
        poweredByVisible:    { type: boolean }
        createdAt:           { type: string }
        updatedAt:           { type: string }

    BrandingProfileInput:
      type: object
      properties:
        name:                { type: string }
        companyName:         { type: string }
        tagline:             { type: ["string", "null"] }
        companyAddress:      { type: ["string", "null"] }
        companyPhone:        { type: ["string", "null"] }
        companyEmail:        { type: ["string", "null"] }
        companyWebsite:      { type: ["string", "null"] }
        licenseNumber:       { type: ["string", "null"] }
        logoUrl:             { type: ["string", "null"] }
        appIconUrl:          { type: ["string", "null"] }
        primaryColor:        { type: ["string", "null"] }
        secondaryColor:      { type: ["string", "null"] }
        accentColor:         { type: ["string", "null"] }
        reportFooterText:    { type: ["string", "null"] }
        supportInfo:         { type: ["string", "null"] }
        signatureDisclaimer: { type: ["string", "null"] }
        emailSenderName:     { type: ["string", "null"] }
        emailReplyTo:        { type: ["string", "null"] }
        emailFooter:         { type: ["string", "null"] }
        poweredByVisible:    { type: boolean }

    # ── PROPERTY SCHEMAS ────────────────────────────────────────────────────────
    Hotspot:
      type: object
      required: [zone, description, severity]
      properties:
        zone:        { type: string }
        description: { type: string }
        severity:    { type: string, enum: [low, medium, high] }

    PropertySummary:
      type: object
      required: [addressKey, siteAddress, propertyType, inspectionCount, hotspotCount, noteCount, openIssueCount, hasProfile]
      properties:
        addressKey:      { type: string }
        siteAddress:     { type: string }
        clientName:      { type: ["string", "null"] }
        propertyType:    { type: string }
        inspectionCount: { type: integer }
        hotspotCount:    { type: integer }
        noteCount:       { type: integer }
        openIssueCount:  { type: integer }
        lastVisit:       { type: ["string", "null"] }
        hasProfile:      { type: boolean }

    RecurringIssue:
      type: object
      required: [category, count, severity]
      properties:
        category:          { type: string }
        count:             { type: integer }
        severity:          { type: string }
        lastSeen:          { type: ["string", "null"] }
        sampleDescription: { type: ["string", "null"] }

    HistoricalPhoto:
      type: object
      required: [url, inspectionId]
      properties:
        url:          { type: string }
        caption:      { type: ["string", "null"] }
        inspectionId: { type: integer }
        createdAt:    { type: ["string", "null"] }

    VisitHistoryItem:
      type: object
      required: [inspectionId, createdAt, status, findingsCount]
      properties:
        inspectionId:   { type: integer }
        createdAt:      { type: string }
        status:         { type: string }
        technicianName: { type: ["string", "null"] }
        severity:       { type: ["string", "null"] }
        findingsCount:  { type: integer }
        completedAt:    { type: ["string", "null"] }

    PropertyNote:
      type: object
      required: [id, addressKey, note, createdAt]
      properties:
        id:         { type: integer }
        addressKey: { type: string }
        note:       { type: string }
