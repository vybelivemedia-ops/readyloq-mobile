openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ReadyLoq - AI-powered inspection intelligence platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: schedule
    description: Dispatch scheduling calendar (manager+)
  - name: inspections
    description: Inspection management
  - name: analysis
    description: AI analysis
  - name: dataset
    description: Dataset library
  - name: intelligence-dataset
    description: Intelligence dataset & AI learning center
  - name: reports
    description: Report generation
  - name: analytics
    description: Analytics dashboard
  - name: branding
    description: White-label branding
  - name: properties
    description: Property intelligence feed
  - name: leads
    description: Marketing site lead capture
  - name: beta
    description: Closed-beta center (feedback, errors, checklist, testers, invites)
  - name: gemini
    description: Gemini AI chat and image operations
  - name: technician
    description: Technician daily route/rig assignments
  - name: mission-control
    description: ReadyLoq Mission Control super-admin operations

paths:
  # ── SCHEDULE ─────────────────────────────────────────────────────────────────
  /schedule:
    get:
      operationId: getSchedule
      tags: [schedule]
      summary: List inspections for the scheduling calendar (manager+)
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
          description: Start date (YYYY-MM-DD), inclusive
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
          description: End date (YYYY-MM-DD), inclusive
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleEntry"
        "400":
          description: Missing or invalid date params

  /schedule/{id}:
    patch:
      operationId: reassignInspection
      tags: [schedule]
      summary: Reschedule or reassign a technician (manager+)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEntry"
        "404":
          description: Inspection not found

  /schedule/property-profile:
    get:
      operationId: getPropertyProfile
      tags: [schedule]
      summary: >-
        Pre-inspection briefing for a property address — the last 5
        inspections at that address, AI-synthesised historical pests/findings
        from property memory, property notes (access instructions, hazards,
        special needs), and the active bait station count from the most
        recent inspection there. Access rules mirror GET
        /schedule/route-outlook/{inspectionId}: manager/owner/sales see any
        company address; other roles must have an inspection of their own at
        that address.
      parameters:
        - name: address
          in: query
          required: true
          schema: { type: string }
          description: Exact site address to look up (matches inspections.siteAddress)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyProfile"
        "400":
          description: Missing address query param
        "403":
          description: Access denied — no inspection assigned to the caller at this address

  /schedule/stop-history/{inspectionId}:
    get:
      operationId: getStopHistory
      tags: [schedule]
      summary: >-
        Complete pre-service history for one scheduled stop, including recent
        inspection summaries, photo evidence, site notes, recurring findings,
        and material/chemical history. Inspection-backed history is limited to
        completed service records before the stop's scheduled timestamp; a
        same-day sibling completed before that time is included, while pending
        and later records are excluded. When the guarded PestPac bridge is
        activated, the response also includes normalized legacy location notes.
        Technicians must be assigned to the exact stop; manager/owner/sales roles
        may read any stop in their company.
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema: { type: integer }
          description: Scheduled inspection/stop ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopHistory"
        "400":
          description: Invalid inspection id
        "403":
          description: Access denied — the stop is not assigned to the caller
        "404":
          description: Stop not found in the authenticated company

  /schedule/property-visit/{inspectionId}:
    get:
      operationId: getPropertyVisit
      tags: [schedule]
      summary: >-
        Drill-down detail for a "visit" — every inspection sharing the same
        company + site address + calendar date as the given inspection
        (covers a single-family stop and a same-day multi-unit property
        alike) — plus every chemical application logged across all of that
        visit's units, each carrying a retreatment-interval compliance check
        against the most recent PRIOR application of the same product at
        this address. Access rules mirror GET /schedule/property-profile.
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema: { type: integer }
          description: >-
            Any inspection belonging to the visit — used only to resolve the
            address and calendar date; the response covers every sibling
            inspection at that address/date, not just this one.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyVisitDetail"
        "400":
          description: Invalid inspection id
        "403":
          description: Access denied — no inspection assigned to the caller at this address
        "404":
          description: Inspection not found

  /schedule/route-calendar:
    get:
      operationId: getRouteCalendar
      tags: [schedule]
      summary: >-
        Integrated Route Calendar — stops for a date window grouped by
        calendar day, each annotated with a Route Readiness flag (has the
        assigned technician set up their daily rig for that date?) and a
        rolled-up Route Chemical Outlook count (due-soon/overdue products at
        that stop's address). Same access scoping as GET /schedule
        (manager/owner/sales see all company stops; other roles see only
        their own).
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
          description: Start date (YYYY-MM-DD), inclusive
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
          description: End date (YYYY-MM-DD), inclusive
        - name: tzOffsetMinutes
          in: query
          schema: { type: integer }
          description: >-
            Caller's UTC offset in minutes, using the
            `Date.prototype.getTimezoneOffset()` sign convention. Buckets and
            labels each stop's calendarDate in the caller's local frame
            instead of UTC, keeping it consistent with Route Readiness (which
            keys off the technician's own device-local rig date). Defaults to
            0 (UTC) when omitted.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteCalendarDay"
        "400":
          description: Missing or invalid date params

  /schedule/route-outlook/{inspectionId}:
    get:
      operationId: getRouteOutlook
      tags: [schedule]
      summary: >-
        Full Route Chemical Outlook for a stop's address — every product
        applied there within the lookback window, projected forward from its
        most recent application to flag due / due-soon / overdue for
        reapplication. Access rules mirror GET /schedule/property-visit/{id}:
        manager/owner/sales see any company address; other roles must have an
        inspection of their own at that address.
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema: { type: integer }
          description: >-
            Any inspection at the target address — used only to resolve the
            address and calendar date; the outlook itself covers every
            inspection at that address, not just this one.
        - name: tzOffsetMinutes
          in: query
          schema: { type: integer }
          description: >-
            Caller's UTC offset in minutes (same convention as
            /schedule/route-calendar). Defaults to 0 (UTC) when omitted.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteOutlookDetail"
        "403":
          description: Access denied — no inspection assigned to the caller at this address
        "404":
          description: Inspection not found

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── INSPECTIONS ──────────────────────────────────────────────────────────────
  /inspections:
    get:
      operationId: listInspections
      tags: [inspections]
      summary: List all inspections
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: technicianId
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inspection"
    post:
      operationId: createInspection
      tags: [inspections]
      summary: Create a new inspection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"

  /inspections/{id}:
    get:
      operationId: getInspection
      tags: [inspections]
      summary: Get inspection by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
    patch:
      operationId: updateInspection
      tags: [inspections]
      summary: Update inspection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
    delete:
      operationId: deleteInspection
      tags: [inspections]
      summary: Delete inspection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inspections/{id}/complete:
    post:
      operationId: completeInspection
      tags: [inspections]
      summary: >
        Explicitly complete an in-progress inspection and trigger the
        finalization pipeline (report, AI narrative, customer summary draft,
        Opportunity Intelligence, scorecard). Idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed (or already completed — safe no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteInspectionResult"

  /inspections/{id}/media:
    post:
      operationId: addInspectionMedia
      tags: [inspections]
      summary: Add media to inspection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionMedia"

  # ── AI ANALYSIS ──────────────────────────────────────────────────────────────
  /analysis:
    get:
      operationId: listAnalysisResults
      tags: [analysis]
      summary: List AI analysis results
      parameters:
        - name: inspectionId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisResult"

  /analysis/analyze:
    post:
      operationId: analyzeInspection
      tags: [analysis]
      summary: Run real AI vision analysis on captured inspection photos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInspectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /analysis/{id}:
    get:
      operationId: getAnalysisResult
      tags: [analysis]
      summary: Get analysis result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /analysis/{id}/feedback:
    post:
      operationId: submitAnalysisFeedback
      tags: [analysis]
      summary: Submit technician feedback on analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /analysis/summary:
    get:
      operationId: getAnalysisSummary
      tags: [analysis]
      summary: Get aggregated AI analysis summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSummary"

  # ── DATASET LIBRARY ───────────────────────────────────────────────────────────
  /dataset:
    get:
      operationId: listDatasetImages
      tags: [dataset]
      summary: List dataset library images
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: pestType
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPage"

  /dataset/categories:
    get:
      operationId: listDatasetCategories
      tags: [dataset]
      summary: List all dataset categories with counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetCategory"

  # ── INTELLIGENCE DATASET ─────────────────────────────────────────────────────
  /intelligence-dataset/categories:
    get:
      operationId: listIntelligenceCategories
      tags: [intelligence-dataset]
      summary: Taxonomy groups + subcategories with per-company counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntelligenceCategory"

  /intelligence-dataset/settings:
    get:
      operationId: getIntelligenceSettings
      tags: [intelligence-dataset]
      summary: Get the company's intelligence sharing participation setting
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSettings"
    patch:
      operationId: updateIntelligenceSettings
      tags: [intelligence-dataset]
      summary: Update the company's sharing participation (manager+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceSettingsInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSettings"

  /intelligence-dataset/analytics:
    get:
      operationId: getIntelligenceAnalytics
      tags: [intelligence-dataset]
      summary: Per-company intelligence dataset analytics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceAnalytics"

  /intelligence-dataset/records:
    get:
      operationId: listIntelligenceRecords
      tags: [intelligence-dataset]
      summary: List intelligence records for the caller's company
      parameters:
        - name: category
          in: query
          schema: { type: ["string", "null"] }
        - name: subcategory
          in: query
          schema: { type: ["string", "null"] }
        - name: status
          in: query
          schema: { type: ["string", "null"] }
        - name: verificationLevel
          in: query
          schema: { type: ["integer", "null"] }
        - name: mine
          in: query
          schema: { type: ["boolean", "null"] }
        - name: search
          in: query
          schema: { type: ["string", "null"] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecordPage"
    post:
      operationId: createIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Create a record from an uploaded image (runs the AI suggestion)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceRecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  /intelligence-dataset/records/{id}:
    get:
      operationId: getIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Get a single intelligence record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"
    patch:
      operationId: confirmIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Technician confirms/corrects the AI suggestion + adds detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceConfirmInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  /intelligence-dataset/records/{id}/skip:
    post:
      operationId: skipIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Skip a record (retained, excluded from the dataset)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  /intelligence-dataset/records/{id}/vote:
    post:
      operationId: voteIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Cast a confirm/dispute vote (drives multi-technician verification)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceVoteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  /intelligence-dataset/records/{id}/review:
    post:
      operationId: reviewIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Manager review — approve / reject / edit / expert-verify
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceReviewInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  # ── REPORTS ──────────────────────────────────────────────────────────────────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated reports
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a new report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /reports/{id}/generate-narrative:
    post:
      operationId: generateReportNarrative
      tags: [reports]
      summary: Generate or regenerate the AI narrative report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateNarrativeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ── ANALYTICS ────────────────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getAnalyticsDashboard
      tags: [analytics]
      summary: Get full analytics dashboard data
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsDashboard"

  /analytics/trends:
    get:
      operationId: getAnalyticsTrends
      tags: [analytics]
      summary: Get findings trends over time
      parameters:
        - name: period
          in: query
          schema:
            type: string
            default: "30d"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /analytics/technicians:
    get:
      operationId: getTechnicianPerformance
      tags: [analytics]
      summary: Get technician performance metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechnicianPerformance"

  /analytics/risk:
    get:
      operationId: getInfestationRisk
      tags: [analytics]
      summary: Get infestation risk assessment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfestationRisk"

  # ── INTELLIGENCE (ReadyLoq Command) ──────────────────────────────────────────
  /intelligence/opportunities:
    get:
      operationId: getOpportunityIntelligence
      tags: [intelligence]
      summary: Get evidence-based opportunity intelligence
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityIntelligence"

  /intelligence/callbacks:
    get:
      operationId: getCallbackIntelligence
      tags: [intelligence]
      summary: Get callback intelligence (chains and patterns)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackIntelligence"

  /intelligence/property-risk:
    get:
      operationId: getPropertyRiskInsights
      tags: [intelligence]
      summary: Get property risk insights
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRiskInsights"

  # ── BRANDING ─────────────────────────────────────────────────────────────────
  /branding:
    get:
      operationId: getBranding
      tags: [branding]
      summary: Get the active white-label branding profile (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"

  /branding/active:
    get:
      operationId: getActiveBranding
      tags: [branding]
      summary: Get the active white-label branding profile (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"

  /branding/company:
    get:
