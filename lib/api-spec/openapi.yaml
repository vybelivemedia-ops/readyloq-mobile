        riskScore:      { type: integer }
        riskLevel:      { type: string, enum: [low, medium, high, critical] }
        findingsCount:  { type: integer }
        photosAnalyzed: { type: integer }
        createdAt:      { type: string }
        updatedAt:      { type: string }

    InspectionScorecardListItem:
      allOf:
