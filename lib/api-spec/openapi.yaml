          properties:
            siteAddress:    { type: string }
            inspectionDate: { type: string }

    ScorecardSummary:
      type: object
      required: [totalScorecards, avgQuality, avgRisk, riskDistribution, technicians, missedByService, topConduciveConditions, topRecommendedServices]
