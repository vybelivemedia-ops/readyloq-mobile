        topRecommendedServices:
          type: array
          items:
            type: object
            required: [label, occurrences]
            properties:
              label:       { type: string }
              occurrences: { type: integer }

    CustomerSummary:
      type: object
      required: [id, companyId, inspectionId, body, status, approvedByUserId, approvedAt, shareToken, shareExpiresAt, createdAt, updatedAt]
      properties:
        id:               { type: integer }
        companyId:        { type: integer }
        inspectionId:     { type: integer }
        body:             { type: string }
        status:           { type: string, enum: [draft, approved] }
        approvedByUserId: { type: ["integer", "null"] }
        approvedAt:       { type: ["string", "null"] }
        shareToken:       { type: ["string", "null"] }
        shareExpiresAt:   { type: ["string", "null"] }
        createdAt:        { type: string }
        updatedAt:        { type: string }

    SalesProposal:
      type: object
      required: [id, companyId, propertyAddress, title, status, opportunityIds, intro, notes, createdByUserId, createdAt, updatedAt]
      properties:
        id:              { type: integer }
