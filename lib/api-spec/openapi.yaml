openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ReadyLoq - AI-powered inspection intelligence platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inspections
    description: Inspection management
  - name: analysis
    description: AI analysis
  - name: dataset
    description: Dataset library
  - name: intelligence-dataset
    description: Intelligence dataset & AI learning center
  - name: reports
    description: Report generation
  - name: analytics
    description: Analytics dashboard
  - name: branding
    description: White-label branding
  - name: properties
    description: Property intelligence feed
  - name: leads
    description: Marketing site lead capture

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── INSPECTIONS ──────────────────────────────────────────────────────────────
  /inspections:
    get:
      operationId: listInspections
      tags: [inspections]
      summary: List all inspections
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: technicianId
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inspection"
    post:
      operationId: createInspection
      tags: [inspections]
      summary: Create a new inspection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"

  /inspections/{id}:
    get:
      operationId: getInspection
      tags: [inspections]
      summary: Get inspection by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
    patch:
      operationId: updateInspection
      tags: [inspections]
      summary: Update inspection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
    delete:
      operationId: deleteInspection
      tags: [inspections]
      summary: Delete inspection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inspections/{id}/media:
    post:
      operationId: addInspectionMedia
      tags: [inspections]
      summary: Add media to inspection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionMedia"

  # ── AI ANALYSIS ──────────────────────────────────────────────────────────────
  /analysis:
    get:
      operationId: listAnalysisResults
      tags: [analysis]
      summary: List AI analysis results
      parameters:
        - name: inspectionId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisResult"

  /analysis/analyze:
    post:
      operationId: analyzeInspection
      tags: [analysis]
      summary: Run real AI vision analysis on captured inspection photos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInspectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /analysis/{id}:
    get:
      operationId: getAnalysisResult
      tags: [analysis]
      summary: Get analysis result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /analysis/{id}/feedback:
    post:
      operationId: submitAnalysisFeedback
      tags: [analysis]
      summary: Submit technician feedback on analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /analysis/summary:
    get:
      operationId: getAnalysisSummary
      tags: [analysis]
      summary: Get aggregated AI analysis summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSummary"

  # ── DATASET LIBRARY ───────────────────────────────────────────────────────────
  /dataset:
    get:
      operationId: listDatasetImages
      tags: [dataset]
      summary: List dataset library images
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: pestType
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPage"

  /dataset/categories:
    get:
      operationId: listDatasetCategories
      tags: [dataset]
      summary: List all dataset categories with counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetCategory"

  # ── INTELLIGENCE DATASET ─────────────────────────────────────────────────────
  /intelligence-dataset/categories:
    get:
      operationId: listIntelligenceCategories
      tags: [intelligence-dataset]
      summary: Taxonomy groups + subcategories with per-company counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntelligenceCategory"

  /intelligence-dataset/settings:
    get:
      operationId: getIntelligenceSettings
      tags: [intelligence-dataset]
      summary: Get the company's intelligence sharing participation setting
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSettings"
    patch:
      operationId: updateIntelligenceSettings
      tags: [intelligence-dataset]
      summary: Update the company's sharing participation (manager+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceSettingsInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSettings"

  /intelligence-dataset/analytics:
    get:
      operationId: getIntelligenceAnalytics
      tags: [intelligence-dataset]
      summary: Per-company intelligence dataset analytics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceAnalytics"

  /intelligence-dataset/records:
    get:
      operationId: listIntelligenceRecords
      tags: [intelligence-dataset]
      summary: List intelligence records for the caller's company
      parameters:
        - name: category
          in: query
          schema: { type: ["string", "null"] }
        - name: subcategory
          in: query
          schema: { type: ["string", "null"] }
        - name: status
          in: query
          schema: { type: ["string", "null"] }
        - name: verificationLevel
          in: query
          schema: { type: ["integer", "null"] }
        - name: mine
          in: query
          schema: { type: ["boolean", "null"] }
        - name: search
          in: query
          schema: { type: ["string", "null"] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecordPage"
    post:
      operationId: createIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Create a record from an uploaded image (runs the AI suggestion)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceRecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  /intelligence-dataset/records/{id}:
    get:
      operationId: getIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Get a single intelligence record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"
    patch:
      operationId: confirmIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Technician confirms/corrects the AI suggestion + adds detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceConfirmInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  /intelligence-dataset/records/{id}/skip:
    post:
      operationId: skipIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Skip a record (retained, excluded from the dataset)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  /intelligence-dataset/records/{id}/vote:
    post:
      operationId: voteIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Cast a confirm/dispute vote (drives multi-technician verification)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceVoteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  /intelligence-dataset/records/{id}/review:
    post:
      operationId: reviewIntelligenceRecord
      tags: [intelligence-dataset]
      summary: Manager review — approve / reject / edit / expert-verify
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceReviewInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceRecord"

  # ── REPORTS ──────────────────────────────────────────────────────────────────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated reports
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a new report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /reports/{id}/generate-narrative:
    post:
      operationId: generateReportNarrative
      tags: [reports]
      summary: Generate or regenerate the AI narrative report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ── ANALYTICS ────────────────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getAnalyticsDashboard
      tags: [analytics]
      summary: Get full analytics dashboard data
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsDashboard"

  /analytics/trends:
    get:
      operationId: getAnalyticsTrends
      tags: [analytics]
      summary: Get findings trends over time
      parameters:
        - name: period
          in: query
          schema:
            type: string
            default: "30d"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

  /analytics/technicians:
    get:
      operationId: getTechnicianPerformance
      tags: [analytics]
      summary: Get technician performance metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechnicianPerformance"

  /analytics/risk:
    get:
      operationId: getInfestationRisk
      tags: [analytics]
      summary: Get infestation risk assessment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfestationRisk"

  # ── INTELLIGENCE (ReadyLoq Command) ──────────────────────────────────────────
  /intelligence/opportunities:
    get:
      operationId: getOpportunityIntelligence
      tags: [intelligence]
      summary: Get evidence-based opportunity intelligence
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityIntelligence"

  /intelligence/callbacks:
    get:
      operationId: getCallbackIntelligence
      tags: [intelligence]
      summary: Get callback intelligence (chains and patterns)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackIntelligence"

  /intelligence/property-risk:
    get:
      operationId: getPropertyRiskInsights
      tags: [intelligence]
      summary: Get property risk insights
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRiskInsights"

  # ── BRANDING ─────────────────────────────────────────────────────────────────
  /branding:
    get:
      operationId: getBranding
      tags: [branding]
      summary: Get the active white-label branding profile (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"

  /branding/active:
    get:
      operationId: getActiveBranding
      tags: [branding]
      summary: Get the active white-label branding profile (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"

  /branding/company:
    get:
      operationId: getCompanyBranding
      tags: [branding]
      summary: Get the caller company's active branding profile (authenticated)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"

  /branding/profiles:
    get:
      operationId: listBrandingProfiles
      tags: [branding]
      summary: List all branding profiles (manager only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandingProfile"
    post:
      operationId: createBrandingProfile
      tags: [branding]
      summary: Create a branding profile (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"

  /branding/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getBrandingProfile
      tags: [branding]
      summary: Get a branding profile (manager only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"
    patch:
      operationId: updateBrandingProfile
      tags: [branding]
      summary: Update a branding profile (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingProfileInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"
    delete:
      operationId: deleteBrandingProfile
      tags: [branding]
      summary: Delete a branding profile (manager only)
      responses:
        "204":
          description: No Content

  /branding/profiles/{id}/duplicate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: duplicateBrandingProfile
      tags: [branding]
      summary: Duplicate a branding profile (manager only)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"

  /branding/profiles/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: activateBrandingProfile
      tags: [branding]
      summary: Set a branding profile as active (manager only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"

  /branding/restore-defaults:
    post:
      operationId: restoreBrandingDefaults
      tags: [branding]
      summary: Reset the default profile to ReadyLoq defaults and activate it (manager only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingProfile"

  # ── PROPERTIES ───────────────────────────────────────────────────────────────
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all known properties with an intelligence summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertySummary"

  /properties/lookup:
    get:
      operationId: lookupProperty
      tags: [properties]
      summary: Look up property intelligence by free-text site address (pre-inspection)
      parameters:
        - name: siteAddress
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyLookupResult"

  /properties/{addressKey}:
    get:
      operationId: getPropertyFeed
      tags: [properties]
      summary: Get the full intelligence feed for a property
      parameters:
        - name: addressKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyFeed"
    patch:
      operationId: updatePropertyProfile
      tags: [properties]
      summary: Create or update the authored intelligence for a property
      parameters:
        - name: addressKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyFeed"

  /properties/{addressKey}/notes:
    post:
      operationId: addPropertyNote
      tags: [properties]
      summary: Append a field note to a property
      parameters:
        - name: addressKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyNote"

  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Capture a marketing-site lead (demo request or contact inquiry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    # ── LEAD SCHEMAS ────────────────────────────────────────────────────────────
    Lead:
      type: object
      required: [id, type, name, email, status, createdAt]
      properties:
        id:          { type: integer }
        type:        { type: string, enum: [demo, contact] }
        name:        { type: string }
        email:       { type: string }
        phone:       { type: ["string", "null"] }
        companyName: { type: ["string", "null"] }
        role:        { type: ["string", "null"] }
        teamSize:    { type: ["string", "null"] }
        message:     { type: ["string", "null"] }
        status:      { type: string }
        source:      { type: ["string", "null"] }
        createdAt:   { type: string }

    LeadInput:
      type: object
      required: [type, name, email]
      properties:
        type:        { type: string, enum: [demo, contact] }
        name:        { type: string, minLength: 1, maxLength: 200 }
        email:       { type: string, format: email, maxLength: 320 }
        phone:       { type: string, maxLength: 50 }
        companyName: { type: string, maxLength: 200 }
        role:        { type: string, maxLength: 100 }
        teamSize:    { type: string, maxLength: 50 }
        message:     { type: string, maxLength: 5000 }
        source:      { type: string, maxLength: 200 }

    # ── INSPECTION SCHEMAS ──────────────────────────────────────────────────────
    Inspection:
      type: object
      required: [id, siteAddress, status, technicianName, createdAt]
      properties:
        id:          { type: integer }
        siteAddress: { type: string }
        clientName:  { type: ["string", "null"] }
        technicianName: { type: string }
        technicianId: { type: ["string", "null"] }
        status:      { type: string }
        pestTypes:
