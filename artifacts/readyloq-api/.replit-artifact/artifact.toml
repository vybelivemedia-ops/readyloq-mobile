kind = "mobile"
previewPath = "/api"
title = "ReadyLoq API"
version = "1.0.0"
id = "artifacts/readyloq-api"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/api/healthz"
name = "expo"
paths = [ "/api" ]
localPort = 23590

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/api-server", "run", "build:production" ]
run = [ "pnpm", "--filter", "@workspace/api-server", "run", "start" ]

[services.env]
PORT = "23590"
BASE_PATH = "/api"

[[services]]
name = "metro"
paths = [ "/app" ]
localPort = 8082

[services.development]
run = "pnpm --filter @workspace/readyloq-app run dev"

[services.env]
PORT = "8082"