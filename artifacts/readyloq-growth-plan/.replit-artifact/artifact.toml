kind = "slides"
previewPath = "/readyloq-growth-plan/"
title = "ReadyLoq $100M Growth Plan"
description = "Enterprise growth and scale strategy deck covering outcome-driven product positioning, value proposition, tiered pricing architecture, AI data moat strategy, and the path to $100M ARR in the pest control field-service market."
version = "1.0.0"
id = "artifacts/readyloq-growth-plan"
router = "path"

[[services]]
name = "web"
paths = [ "/readyloq-growth-plan/" ]
localPort = 20668

[services.development]
run = "pnpm --filter @workspace/readyloq-growth-plan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/readyloq-growth-plan", "run", "build" ]
serve = "static"
publicDir = "artifacts/readyloq-growth-plan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20668"
BASE_PATH = "/readyloq-growth-plan/"
