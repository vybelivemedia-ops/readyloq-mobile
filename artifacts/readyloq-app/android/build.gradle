// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Pin the exact AGP version that @react-native/gradle-plugin@0.81.5 declares
    // in its own libs.versions.toml (agp = "8.11.0").  Leaving this unversioned
    // lets Gradle pick whatever it resolves first, which can differ between EAS
    // cloud and local builds.  9.0 is NOT used: it removed APIs the RN plugin
    // still calls, which would break codegen and autolinking.
    classpath('com.android.tools.build:gradle:8.11.0')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // Meta's private GitHub Packages repository must be declared here because
    // this project-level repository block takes precedence over settings.gradle.
    maven {
      url 'https://maven.pkg.github.com/facebook/meta-wearables-dat-android'
      credentials {
        username = System.getenv('GITHUB_PACKAGES_USERNAME') ?: System.getenv('GITHUB_ACTOR') ?: 'x-access-token'
        password = System.getenv('GITHUB_PACKAGES_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: ''
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
