kind = "web"
previewPath = "/"
title = "ReadyLoq Marketing"
version = "1.0.0"
id = "artifacts/readyloq-marketing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25413

[services.development]
run = "pnpm --filter @workspace/readyloq-marketing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/readyloq-marketing", "run", "build" ]
serve = "static"
publicDir = "artifacts/readyloq-marketing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25413"
BASE_PATH = "/"
