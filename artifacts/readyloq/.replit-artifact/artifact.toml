kind = "web"
previewPath = "/"
title = "ReadyLoq"
version = "1.0.0"
id = "artifacts/readyloq"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20257

[services.development]
run = "pnpm --filter @workspace/readyloq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/readyloq", "run", "build" ]
publicDir = "artifacts/readyloq/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20257"
BASE_PATH = "/"
