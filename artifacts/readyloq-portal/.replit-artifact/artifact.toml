kind = "web"
previewPath = "/readyloq-portal/"
title = "ReadyLoq Company Portal"
description = "A multi-tenant web portal for ReadyLoq company users. Owners see KPI tiles, inspection history, and team rosters. Managers see the approvals queue and technician performance. Dispatchers see a route status board. Property managers see a read-only client portal with building inspection history and AI reports. Role detection is automatic after Clerk sign-in."
version = "1.0.0"
id = "artifacts/readyloq-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/readyloq-portal/" ]
localPort = 19135

[services.development]
run = "pnpm --filter @workspace/readyloq-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/readyloq-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/readyloq-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19135"
BASE_PATH = "/readyloq-portal/"
