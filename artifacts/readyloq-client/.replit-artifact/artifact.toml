kind = "web"
previewPath = "/readyloq-client/"
title = "ReadyLoq Commercial & Client Portal"
description = "A read-only self-serve portal for commercial property managers and building owners. Sign in with Clerk to view building inspection history, approved AI-generated reports, and 12-month activity trends — without needing to contact the ReadyLoq service provider's office."
version = "1.0.0"
id = "artifacts/readyloq-client"
router = "path"

[[services]]
name = "web"
paths = [ "/readyloq-client/" ]
localPort = 23868

[services.development]
run = "pnpm --filter @workspace/readyloq-client run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/readyloq-client", "run", "build" ]
serve = "static"
publicDir = "artifacts/readyloq-client/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23868"
BASE_PATH = "/readyloq-client/"
