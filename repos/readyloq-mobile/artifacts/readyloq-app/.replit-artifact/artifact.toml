kind = "mobile"
previewPath = "/mobile/"
title = "ReadyLoq"
version = "1.0.0"
id = "artifacts/readyloq-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20601

[services.development]
run = "pnpm --filter @workspace/readyloq-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/readyloq-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/readyloq-app", "run", "serve" ]

[services.env]
PORT = "20601"
BASE_PATH = "/mobile/"
