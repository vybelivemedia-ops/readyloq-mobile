        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        durationSeconds:
          type: ["number", "null"]
        clipId:
          type: ["string", "null"]
        streamId:
          type: ["string", "null"]
        profileUserId:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
          description: Title for clip/stream previews.
        thumbnailUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
          description: Stream status for stream previews.
        displayName:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]

