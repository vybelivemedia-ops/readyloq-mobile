openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: VYBE LIVE API - POV wearable livestreaming platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User profiles
  - name: discovery
    description: Creator discovery and networking
  - name: streams
    description: Livestream sessions
  - name: platforms
    description: Connected streaming platforms
  - name: clips
    description: AI-generated clips
  - name: analytics
    description: Creator analytics
  - name: subscriptions
    description: Billing and subscriptions
  - name: notifications
    description: User notifications
  - name: reports
    description: Content reporting
  - name: admin
    description: Admin dashboard
  - name: oauth
    description: OAuth platform connections
  - name: storage
    description: Object storage upload and serving endpoints
  - name: messages
    description: Direct messages and conversations
  - name: waitlist
    description: Beta waitlist signup
  - name: account
    description: Account deletion and lifecycle
  - name: missionControl
    description: Internal AI headquarters — executives, tasks, memory, chat, handoffs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /version:
    get:
      operationId: getServerVersion
      tags: [health]
      summary: Build provenance of the running server
      responses:
        "200":
          description: Build provenance metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildProvenance"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset token issued (MVP — will be delivered via email in production)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordPayload"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a valid reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset — returns a fresh auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/stats:
    get:
      operationId: getMyStats
      tags: [users]
      summary: Get creator stats summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorStats"

  /users/{userId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get public creator profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a creator
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "400":
          description: Cannot follow yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a creator
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/followers:
    get:
      operationId: listFollowers
      tags: [users]
      summary: List a creator's followers
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorList"
        "400":
          description: Missing or invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/following:
    get:
      operationId: listFollowing
      tags: [users]
      summary: List creators a user follows
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorList"
        "400":
          description: Missing or invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Discovery ───────────────────────────────────────────────────────────────
  /discovery/creators:
    get:
      operationId: listDiscoveryCreators
      tags: [discovery]
      summary: List creators for a discovery feed section
      description: >
        Returns a paginated list of creators for the requested discovery
        section. Excludes the requesting creator and creators they already
        follow. The "nearby" section requires the requester to have a location
        set; otherwise it returns an empty list.
      security:
        - bearerAuth: []
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [trending, new, growing, nearby]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorList"
        "400":
          description: Missing or invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discovery/suggested:
    get:
      operationId: listSuggestedCreators
      tags: [discovery]
      summary: List suggested creators with an explainable reason
      description: >
        Returns creators ranked by a deterministic score over shared content
        category, geographic proximity, shared collaboration interests, and
        follow-graph overlap. Each suggestion includes a human-readable reason.
        Excludes the requesting creator and creators they already follow.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedCreatorList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discovery/browse:
    get:
      operationId: browseCreators
      tags: [discovery]
      summary: Browse and search creators by category and text
      description: >
        Returns a paginated list of creators, optionally filtered by content
        category and/or a free-text query matched against username and display
        name. Excludes the requesting creator.
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ContentCategory"
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Streams ─────────────────────────────────────────────────────────────────
  /streams:
    get:
      operationId: listStreams
      tags: [streams]
      summary: List current user's streams
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [live, ended, scheduled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamList"
    post:
      operationId: createStream
      tags: [streams]
      summary: Create a new stream session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"

  /streams/active:
    get:
      operationId: getActiveStream
      tags: [streams]
      summary: Get currently active stream for user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        "404":
          description: No active stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams/{streamId}:
    get:
      operationId: getStream
      tags: [streams]
      summary: Get a specific stream
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStream
      tags: [streams]
      summary: Update stream details
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
    delete:
      operationId: deleteStream
      tags: [streams]
      summary: Delete a stream
      description: >
        Permanently deletes a stream along with its recording file (when stored
        in app storage) and all clips generated from it (including their media).
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /streams/recordings:
    get:
      operationId: listStreamRecordings
      tags: [streams]
      summary: List the current user's recorded (ended) streams
      description: >
        Returns ended streams as an archive list, each annotated with a
        recording status (archived = playable, pending = finalizing,
        unavailable = no recording captured).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingList"

  /streams/{streamId}/recording/play-url:
    get:
      operationId: getStreamRecordingPlayUrl
      tags: [streams]
      summary: Get a short-lived playback URL for a stream recording
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingPlayUrl"
        "404":
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Recording not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams/{streamId}/markers:
    get:
      operationId: listStreamMarkers
      tags: [streams]
      summary: List timeline markers for a stream
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamMarkerList"
        "404":
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createStreamMarker
      tags: [streams]
      summary: Create a timeline marker (voice / gesture / manual)
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamMarker"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Stream not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recognition-settings:
    get:
      operationId: getRecognitionSettings
      tags: [recognition]
      summary: Get the current user's voice/gesture recognition settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecognitionSettings"
    patch:
      operationId: updateRecognitionSettings
      tags: [recognition]
      summary: Update the current user's recognition settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecognitionSettingsUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecognitionSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /streams/{streamId}/start:
    post:
      operationId: startStream
      tags: [streams]
      summary: Start a stream (go live)
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"

  /streams/{streamId}/end:
    post:
      operationId: endStream
      tags: [streams]
      summary: End a live stream
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamEndStats"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"

  /streams/{streamId}/agora-token:
    post:
      operationId: getAgoraToken
      tags: [streams]
      summary: Generate a secure Agora RTC token for a stream channel
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgoraTokenBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgoraTokenPayload"
        "404":
          description: Stream not found

  # ─── Platforms ──────────────────────────────────────────────────────────────
  /platforms:
    get:
      operationId: listPlatforms
      tags: [platforms]
      summary: List connected streaming platforms
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Platform"
    post:
      operationId: connectPlatform
      tags: [platforms]
      summary: Connect a streaming platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"

  /platforms/{platformId}:
    delete:
      operationId: disconnectPlatform
      tags: [platforms]
      summary: Disconnect a platform
      parameters:
        - name: platformId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
    patch:
      operationId: updatePlatform
      tags: [platforms]
      summary: Update platform RTMP settings
      parameters:
        - name: platformId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"

  # ─── Storage ────────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Recording upload ───────────────────────────────────────────────────────
  /streams/{streamId}/recording/upload-url:
    post:
      operationId: requestRecordingUploadUrl
      tags: [streams]
      summary: Get presigned PUT URL to upload a local recording
      security:
        - bearerAuth: []
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingUploadUrlResponse"
        "404":
          description: Stream not found
        "422":
          description: Stream not ended yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerResponse"
        "503":
          description: Storage not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerResponse"

  /streams/{streamId}/recording/finalize:
    post:
      operationId: finalizeRecording
      tags: [streams]
      summary: Register the uploaded recording and enable clip generation
      security:
        - bearerAuth: []
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingFinalizeInput"
      responses:
        "200":
          description: Recording registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFinalizeResult"
        "404":
          description: Stream not found

  # ─── Clip pipeline ───────────────────────────────────────────────────────────
  /streams/{streamId}/clips/generate:
    post:
      operationId: generateClips
      tags: [clips]
      summary: Kick off real FFmpeg clip extraction + AI title/caption generation
      description: |
        Requires the stream to have a recordingUrl set (via /recording/finalize or
        Agora Cloud Recording). Returns a job ID to poll for status.
        Returns 422 with a blocker field when prerequisites are missing.
      security:
        - bearerAuth: []
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipExtractionOptions"
      responses:
        "202":
          description: Clip extraction job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipJob"
        "404":
          description: Stream not found
        "422":
          description: No recording available or AI not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerResponse"
        "503":
          description: Required service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerResponse"

  /clips/jobs/{jobId}:
    get:
      operationId: getClipJob
      tags: [clips]
      summary: Poll clip extraction job status
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipJob"
        "404":
          description: Job not found

  # ─── Clips ──────────────────────────────────────────────────────────────────
  /clips:
    get:
      operationId: listClips
      tags: [clips]
      summary: List current user's clips
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: streamId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipList"
    post:
      operationId: createClip
      tags: [clips]
      summary: Create a new clip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"

  /clips/{clipId}:
    get:
      operationId: getClip
      tags: [clips]
      summary: Get a specific clip
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClip
      tags: [clips]
      summary: Delete a clip
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /clips/{clipId}/captions:
    post:
      operationId: generateClipCaptions
      tags: [clips]
      summary: Generate or regenerate AI captions for a clip
      security:
        - bearerAuth: []
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Captions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          description: Clip not found
        "503":
          description: AI not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerResponse"

  /clips/{clipId}/posts:
    get:
      operationId: listClipPosts
      tags: [clips]
      summary: List publish history for a clip
      security:
        - bearerAuth: []
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Publish history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPostList"

  /clips/{clipId}/publish:
    post:
      operationId: publishClip
      tags: [clips]
      summary: Publish clip to platforms via OAuth
      description: |
        Publishes to youtube_shorts, facebook, or instagram using stored OAuth tokens.
        Returns 422 with blocker=NO_OAUTH_CONNECTION if the platform is not connected.
        Returns 422 with blocker=NO_VIDEO_URL if clip has no video file.
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipPublishInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "422":
          description: Prerequisite missing (no video, no OAuth token, or clip not approved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerResponse"

  /clips/{clipId}/approve:
    post:
      operationId: approveClip
      tags: [clips]
      summary: Approve a clip for publishing (review gate)
      security:
        - bearerAuth: []
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          description: Clip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clips/{clipId}/reject:
    post:
      operationId: rejectClip
      tags: [clips]
      summary: Reject a clip (review gate) — keeps the row but blocks publishing
      security:
        - bearerAuth: []
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clip"
        "404":
          description: Clip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clips/{clipId}/trim:
    post:
      operationId: trimClip
      tags: [clips]
      summary: Re-cut a clip to a new start/end window from the source recording
      description: |
        Re-extracts the clip from the original stream recording using the new
        time window, re-uploads media, and resets the review status to pending.
        Runs asynchronously — poll GET /clips/jobs/{jobId} for progress.
        Returns 422 with blocker=NO_RECORDING if the source recording is gone.
      security:
        - bearerAuth: []
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipTrimInput"
      responses:
        "202":
          description: Trim job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipJob"
        "404":
          description: Clip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Prerequisite missing (no source recording)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerResponse"

  /clips/learning/profile:
    get:
      operationId: getLearningProfile
      tags: [clips]
      summary: Get the creator preference profile and universal learning weights
      description: |
        Returns the creator's learned selection weights (derived from their own
        saved/deleted/published/engagement outcomes) alongside the anonymized
        cross-creator (universal) weights that also inform highlight selection.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProfile"

  # ─── Analytics ──────────────────────────────────────────────────────────────
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get creator analytics dashboard overview
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /analytics/streams/{streamId}:
    get:
      operationId: getStreamAnalytics
      tags: [analytics]
      summary: Get analytics for a specific stream
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamAnalytics"

  # ─── Subscriptions ───────────────────────────────────────────────────────────
  /subscriptions/plans:
    get:
      operationId: listSubscriptionPlans
      tags: [subscriptions]
      summary: List available subscription plans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /subscriptions/me:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get current user's subscription
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: No active subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelSubscription
      tags: [subscriptions]
      summary: Cancel current subscription
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions:
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Provision free plan — paid plans require verified payment
      description: |
        Creates or updates the caller's subscription to the free plan only.
        Attempting to set a paid plan returns 403. Use POST /subscriptions/checkout
        to initiate payment, or POST /admin/users/{userId}/plan for admin overrides.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "403":
          description: Paid plan upgrade requires verified payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/checkout:
    post:
      operationId: createCheckoutSession
      tags: [subscriptions]
      summary: Initiate Stripe checkout for a paid plan
      description: |
        Returns a Stripe-hosted checkout URL. Returns 503 if STRIPE_SECRET_KEY
        is not configured. On successful payment, Stripe fires a webhook to
        POST /subscriptions/webhook which activates the subscription server-side.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutBody"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "503":
          description: Payment provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/webhook:
    post:
      operationId: stripeWebhook
      tags: [subscriptions]
      summary: Stripe webhook — the only server-authoritative path to activate paid plans
      description: |
        Receives Stripe events and verifies the Stripe-Signature header against
        STRIPE_WEBHOOK_SECRET before making any DB changes. This is the ONLY
        path that can activate or upgrade paid subscriptions.
      responses:
        "200":
          description: Event acknowledged
        "400":
          description: Missing or invalid signature
        "503":
          description: Webhook secret not configured

  # ─── Notifications ───────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List user notifications
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "204":
          description: Done

  # ─── Reports ─────────────────────────────────────────────────────────────────
  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a content report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ─── Conversations (Direct Messages) ────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List my DM conversations with last message and unread count
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start or find an existing DM conversation with another user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewConversationInput"
      responses:
        "200":
          description: Existing or newly created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"

  /conversations/{conversationId}/messages:
    get:
      operationId: getConversationMessages
      tags: [messages]
      summary: Get messages in a conversation (paginated, newest first)
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessageList"
        "403":
          description: Not a participant
    post:
      operationId: sendDirectMessage
      tags: [messages]
      summary: Send a message in a conversation
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessageItem"
        "403":
          description: Not a participant

  /conversations/{conversationId}/read:
    put:
      operationId: markConversationRead
      tags: [messages]
      summary: Mark all messages in a conversation as read
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Marked as read
        "403":
          description: Not a participant

  /conversations/{conversationId}/messages/attachment:
    post:
      operationId: sendMessageAttachment
      tags: [messages]
      summary: Send a message with media or a shared VYBE entity
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageAttachmentSendInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessageItem"
        "400":
          description: Invalid attachment payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a participant
        "404":
          description: Referenced entity not found or not owned by sender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{conversationId}/messages/{messageId}/attachment:
    get:
      operationId: getMessageAttachment
      tags: [messages]
      summary: Stream a message's private media attachment (participant-checked)
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The raw attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not a participant
        "404":
          description: Attachment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{conversationId}/messages/{messageId}/reactions:
    post:
      operationId: addMessageReaction
      tags: [messages]
      summary: Add an emoji reaction to a message
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionAddInput"
      responses:
        "200":
          description: Aggregated reactions for the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionListResult"
        "403":
          description: Not a participant
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{conversationId}/messages/{messageId}/reactions/{emoji}:
    delete:
      operationId: removeMessageReaction
      tags: [messages]
      summary: Remove an emoji reaction from a message
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
        - name: emoji
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregated reactions for the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionListResult"
        "403":
          description: Not a participant

  /conversations/{conversationId}/read-state:
    get:
      operationId: getConversationReadState
      tags: [messages]
      summary: Get per-participant last-read timestamps for read receipts
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationReadState"
        "403":
          description: Not a participant

  /conversations/{conversationId}/typing:
    get:
      operationId: getTypingState
      tags: [messages]
      summary: Get which other participants are currently typing (ephemeral, polled)
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingStateResult"
        "403":
          description: Not a participant
    post:
      operationId: setTypingSignal
      tags: [messages]
      summary: Publish an ephemeral typing signal for this conversation
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingSignalInput"
      responses:
        "204":
