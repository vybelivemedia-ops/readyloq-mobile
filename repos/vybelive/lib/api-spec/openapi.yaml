          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        durationSeconds:
          type: ["number", "null"]
        clipId:
          type: ["string", "null"]
        streamId:
          type: ["string", "null"]
        profileUserId:
          type: ["string", "null"]

