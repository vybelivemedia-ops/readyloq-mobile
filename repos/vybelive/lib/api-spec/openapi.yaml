        reactions:
          type: array
          items:
            $ref: "#/components/schemas/MessageReaction"
        createdAt:
          type: string
          format: date-time
        senderName:
          type: string
        senderUsername:
          type: string
        senderAvatarUrl:
          type: ["string", "null"]

    DirectMessageList:
      type: object
