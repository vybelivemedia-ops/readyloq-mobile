      tags: [messages]
      summary: Get total unread DM count for badge display
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"

  # ─── Admin ───────────────────────────────────────────────────────────────────
  /admin/metrics:
