        currentStage:
          type: string
        currentFocus:
          type: array
          items:
            type: string
        nextMilestone:
          type: string
        overallProgress:
          type: integer
        summary:
          type: string
        staleCount:
          type: integer
        lastUpdated:
          type: string
          format: date-time

    AdminRoadmapResponse:
      type: object
      required: [milestones, staleCount, staleTitles, staleDetails]
      properties:
        milestones:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MilestoneItem"
              - type: object
                properties:
                  stale:
                    type: boolean
        staleCount:
          type: integer
        staleTitles:
          type: array
          items:
            type: string
        staleDetails:
          type: array
          items:
            type: object
            required: [id, phase, title, targetDate, status]
            properties:
              id:
                type: string
              phase:
                type: integer
              title:
                type: string
              targetDate:
                type: string
              status:
                type: string

