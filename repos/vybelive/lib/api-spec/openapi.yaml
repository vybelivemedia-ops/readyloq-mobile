  /admin/streams:
    get:
      operationId: listAdminStreams
      tags: [admin]
      summary: List all streams (admin)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
