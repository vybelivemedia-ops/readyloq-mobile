components:
  schemas:
    EngineeringCommit:
      type: object
      required: [sha, message, author, date]
      properties:
        sha:
          type: string
        message:
          type: string
        author:
          type: string
        date:
          type: string
        url:
          type: ["string", "null"]
    EngineeringPullRequest:
      type: object
      required: [number, title, author, createdAt]
      properties:
        number:
          type: integer
        title:
          type: string
        author:
          type: string
        url:
          type: ["string", "null"]
        createdAt:
          type: string
    EngineeringServiceHealth:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [healthy, degraded, down, unknown]
        latencyMs:
          type: ["number", "null"]
    EngineeringRuntimeIssue:
      type: object
      required: [message, count]
      properties:
        message:
          type: string
        count:
          type: integer
        lastSeenAt:
          type: ["string", "null"]
    EngineeringProviderDiagnostic:
      type: object
      required: [name, status, latencyMs]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [connected, degraded, unavailable]
        latencyMs:
          type: number
        error:
          type: ["string", "null"]
        lastSyncAt:
          type: ["string", "null"]
    EngineeringLaunchReadinessFactor:
      type: object
      required: [key, label, state, score, detail]
      properties:
        key:
          type: string
        label:
          type: string
        state:
          type: string
          enum: [strong, watch, at_risk, unknown]
        score:
          type: ["integer", "null"]
        detail:
          type: string
    EngineeringLaunchReadiness:
      type: object
      required: [score, state, factors]
      properties:
        score:
          type: integer
        state:
          type: string
          enum: [ready, approaching, not_ready, unknown]
        factors:
          type: array
          items:
            $ref: "#/components/schemas/EngineeringLaunchReadinessFactor"
    EngineeringSnapshotView:
      type: object
      required:
        [id, productId, productSlug, productName, capturedAt, repository, build, deployment, runtime, healthScore, launchReadiness, blockers, deploymentRisk, launchRisk, providers]
      properties:
        id:
          type: string
        productId:
          type: string
        productSlug:
          type: string
        productName:
          type: string
        capturedAt:
          type: string
        healthScore:
          type: integer
        launchReadiness:
          $ref: "#/components/schemas/EngineeringLaunchReadiness"
        deploymentRisk:
          type: string
          enum: [low, medium, high, unknown]
        launchRisk:
          type: string
          enum: [low, medium, high, unknown]
        blockers:
          type: array
          items:
            type: string
        repository:
          type: object
          required: [branch, recentCommits, openPullRequests, openIssues]
          properties:
            branch:
              type: string
            latestCommit:
              oneOf:
                - $ref: "#/components/schemas/EngineeringCommit"
                - type: "null"
            recentCommits:
              type: array
              items:
                $ref: "#/components/schemas/EngineeringCommit"
            openPullRequests:
              type: array
              items:
                $ref: "#/components/schemas/EngineeringPullRequest"
            openIssues:
              type: integer
        build:
          type: object
          required: [status, failedBuilds]
          properties:
            status:
              type: string
              enum: [passing, failing, stale, unknown]
            lastSuccessfulBuildAt:
              type: ["string", "null"]
            failedBuilds:
              type: integer
            buildDurationMs:
              type: ["number", "null"]
            artifactPath:
              type: ["string", "null"]
        deployment:
          type: object
          required: [status, productionHealth, activeServices, history, urls]
          properties:
            status:
              type: string
              enum: [deployed, development, down, unknown]
            productionHealth:
              type: string
              enum: [healthy, degraded, down, unknown]
            activeServices:
              type: array
              items:
                $ref: "#/components/schemas/EngineeringServiceHealth"
            history:
              type: array
              items:
                type: object
                required: [sha, message, deployedAt, status]
                properties:
                  sha:
                    type: string
                  message:
                    type: string
                  deployedAt:
                    type: string
                  status:
                    type: string
            urls:
              type: array
              items:
                type: string
        runtime:
          type: object
          required: [errors, warnings, unhealthyServices]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/EngineeringRuntimeIssue"
            warnings:
              type: array
              items:
                $ref: "#/components/schemas/EngineeringRuntimeIssue"
            unhealthyServices:
              type: array
              items:
                type: string
        providers:
          type: array
          items:
            $ref: "#/components/schemas/EngineeringProviderDiagnostic"
    EngineeringHistoryView:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/EngineeringSnapshotView"
    EngineeringDiagnosticsView:
      type: object
      required: [snapshotAgeMs, engineeringConfidence, providers, healthScore]
      properties:
        snapshotAgeMs:
          type: number
        lastSuccessfulSyncAt:
          type: ["string", "null"]
        engineeringConfidence:
          type: integer
        healthScore:
          type: integer
        providers:
          type: array
          items:
            $ref: "#/components/schemas/EngineeringProviderDiagnostic"
    EngineeringExecutiveViewItem:
      type: object
      required: [role, headline, focus, details]
      properties:
        role:
          type: string
        headline:
          type: string
        focus:
          type: array
          items:
            type: string
        details:
          type: object
          additionalProperties: true
    EngineeringProductItem:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
    EngineeringProductsView:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/EngineeringProductItem"
    EngineeringEventView:
      type: object
      required: [id, productId, snapshotId, type, severity, title, detail, createdAt]
      properties:
