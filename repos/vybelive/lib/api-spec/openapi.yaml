                $ref: "#/components/schemas/AdminStreamList"

  /admin/users/{userId}/plan:
    post:
      operationId: adminSetUserPlan
      tags: [admin]
      summary: Manually override a user's subscription plan (admin only, beta use)
      description: |
        Server-authoritative plan assignment for beta testing and support overrides.
        Requires admin JWT role. Regular users cannot reach this route.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetPlanBody"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          description: Invalid planId
        "404":
          description: User not found

  # ─── OAuth connections ──────────────────────────────────────────────────────
  /oauth/connections:
    get:
      operationId: listOauthConnections
      tags: [oauth]
      summary: List all OAuth platform connections for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
