          minimum: 0
          description: Highest concurrent viewer count observed during the stream.
        avgViewers:
          type: number
          minimum: 0
          description: Average concurrent viewer count across the stream.
        totalViews:
          type: integer
          minimum: 0
          description: Total view count derived from real session data.

