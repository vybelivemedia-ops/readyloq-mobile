          type: ["string", "null"]
          description: Creator-facing reason the recording failed, when status is "failed".
        durationSeconds:
          type: integer
        hasRecording:
          type: boolean
        clipsCount:
          type: integer
        thumbnailUrl:
          type: ["string", "null"]
        endedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

