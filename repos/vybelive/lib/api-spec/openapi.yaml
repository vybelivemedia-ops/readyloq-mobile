        senderId:
          type: string
        type:
          type: string
          enum: [text, image, video, shared_clip, shared_stream, shared_profile]
        content:
          type: ["string", "null"]
        attachment:
          oneOf:
            - $ref: "#/components/schemas/MessageAttachmentPreview"
