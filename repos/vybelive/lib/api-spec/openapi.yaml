  /oauth/{platform}/confirm:
    post:
      operationId: confirmOauth
      tags: [oauth]
      summary: Confirm OAuth connection using a confirmToken from the deep-link redirect
      description: |
        Two-phase OAuth confirmation. The mobile app calls this after receiving a
        confirmToken in the deep-link redirect from the OAuth callback. The server
        verifies the token belongs to the authenticated user and commits the connection.
      security:
        - bearerAuth: []
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [youtube, facebook, instagram, twitch, kick]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOauthInput"
      responses:
        "200":
          description: Connection confirmed and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid or expired confirmToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: userId mismatch — token belongs to a different user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

