          type: string
          enum:
            - content_creator
            - car_enthusiast
            - fitness_trainer
            - performer
            - business
            - event_organizer
            - other

    WaitlistEntry:
      type: object
      required: [id, firstName, lastName, email, creatorType, createdAt]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        creatorType:
          type: string
        createdAt:
          type: string
          format: date-time

    MilestoneItem:
      type: object
      required: [id, phase, title, description, details, status]
      properties:
        id:
          type: string
